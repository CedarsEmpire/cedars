</div><div class="notice blue" style="margin-top:12px"><strong>Cross-cutting capability · Collective Intelligence</strong>Connect people, AI agents, organizations, sensors and knowledge systems so human judgment, machine pattern-finding, local knowledge and shared memory work together.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Bitcoin Trust & Monetary Network service layer</h2><span class="pill blue">MANDATORY BITCOIN GRID · EXECUTION OFF</span></div><p class="muted small">Bitcoin is an external service layer beneath CEDARS governance. CEDARS remains the operating system. This is not a CEDARS chain or a change to Bitcoin itself.</p><div class="grid layout2">
<div class="module"><h3>Bitcoin Trust Grid</h3><p>Mandatory CEDARS research and evidence component for cryptographic proof and timestamping design. Any live anchoring remains prohibited until separately approved and independently verified; source records remain governed inside CEDARS.</p></div>
<div class="module"><h3>Monetary Network Grid</h3><p>Read-only study of Bitcoin's network design, protocol, issuance and public network signals. No wallet, payment, transfer, settlement or transaction broadcasting.</p></div>
<div class="module"><h3>Scarcity Model Grid</h3><p>Fixed-supply design, issuance schedule, halving history and scarcity indicators. Educational and analytical model; not a price or investment promise.</p></div>
<div class="module"><h3>Security History Grid</h3><p>Proof-of-work, mining difficulty, hashrate context, security design and documented historical incidents.</p></div>
<div class="module"><h3>Adoption Intelligence Grid</h3><p>Historical and current adoption indicators, nodes, ecosystem participation and institutional or merchant adoption research.</p></div>
</div><div class="notice red" style="margin-top:12px"><strong>Strict operating boundary</strong>Design and research only in this Preview. No Bitcoin keys or wallets, no BTC transfers, no transaction broadcasting, no fiat transactions, and no live anchoring until separately approved and independently verified. Financial execution remains OFF.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Four connected human-progress networks</h2></div><div class="grid layout2">
<div class="module"><h3>Internet of Services</h3><p>Discover · match · deliver useful services across cloud, Earth, underground and human business.</p></div>
<div class="module"><h3>Internet of Contribution</h3><p>Verify · attribute · recognize meaningful work and measurable contribution.</p></div>
<div class="module"><h3>Internet of Knowledge</h3><p>Preserve · connect · learn from research, reports, lessons, failures and verified solutions.</p></div>
<div class="module"><h3>Internet of Innovation</h3><p>Invent · simulate · test · verify · deploy new solutions.</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>AI, compute, robotics and connected endpoints</h2></div><div class="grid layout3">
<div class="module"><h3>AI agents & models</h3><p>Task-specific reasoning, extraction, translation, coding, forecasting and support.</p></div>
<div class="module"><h3>Tools & compute</h3><p>Cloud APIs, open models, GPUs / CPUs, queues, caches and scheduled workers.</p></div>
<div class="module"><h3>Connected endpoints</h3><p>Business systems, meters, sensors, marketplaces, people, devices and provider APIs.</p></div>
<div class="module"><h3>Robotics + AI</h3><p>Sense · plan · act · report evidence, with authorized people, devices and robots in the loop; manual review and safe-stop controls remain mandatory.</p></div>
<div class="module"><h3>Collective Memory workflow</h3><p>Capture · structure · connect · reuse. Preserve knowledge assets, lessons and verified solutions.</p></div>
<div class="module"><h3>Innovation Dome™ workspace</h3><p>Memory wall · expert wall · innovation graph · future simulator · contribution ledger.</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Contribution, impact and human safeguards</h2></div><div class="grid layout2">
<div class="module"><h3>Contribution Value concept</h3><p>Impact × Reach × Trust × Sustainability. Signals may include originality, usefulness, adoption, verified outcomes and collaboration.</p></div>
<div class="module"><h3>Human Progress Index</h3><p>Knowledge created · problems solved · innovations deployed · lives and outcomes improved · solutions preserved.</p></div>
<div class="module"><h3>AI Twins™ safeguards</h3><p>Disclosed AI · human remains sovereign · human override · explicit consent · no irreversible or consequential action without permission · memory visible, editable, exportable and deletable.</p></div>
<div class="module"><h3>Trust, ownership and fairness</h3><p>User-owned data · open standards · portable memory · distributed storage under user-controlled policy · encryption · data minimization · evidence-linked attribution and proof of origin · timestamped provenance · transparent royalty rules where approved · independent audits · appeals · anti-gaming controls · regional councils and public accountability.</p></div>
</div><p class="muted small" style="margin-top:12px">Green and environmental opportunities are represented across the source-defined Energy, Food, Water & Land, Earth & Surface, and Underground & Industry scopes; no additional standalone engine is invented here.</p></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>24/7 operating cycle · supervised automation</h2></div><div class="grid layout3">
<div class="module"><h3>01 · Listen</h3><p>Receive authorized orders, schedules, telemetry and supplier availability.</p></div>
<div class="module"><h3>02 · Match</h3><p>Check buyer need, provider eligibility, capacity, geography, price and contract scope.</p></div>
<div class="module"><h3>03 · Execute</h3><p>Route work to approved AI services, people, devices or robots within explicit permissions.</p></div>
<div class="module"><h3>04 · Verify</h3><p>Review quality, service evidence, safety checks and customer acceptance; escalate exceptions to people.</p></div>
<div class="module"><h3>05 · Record</h3><p>Preserve delivery proof, audit events and external invoice or settlement references only. No in-platform payment or funds movement.</p></div>
<div class="module"><h3>06 · Learn</h3><p>Measure reliability, latency, cost, outcomes and incidents; improve only through reviewed changes.</p></div>
</div><div class="notice blue" style="margin-top:12px"><strong>24/7 does not mean unsupervised</strong>Use human review, rate limits, consent, safety checks, alerts, incident response, scoped isolation and an emergency kill switch. Robots and consequential actions remain separately authorized.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Command Centre · evidence-linked measures</h2></div><div class="grid layout3">
<div class="module"><h3>Verified service activity</h3><p>Accepted jobs, billable work evidence and customer acceptance.</p></div>
<div class="module"><h3>Grid utilization</h3><p>Capacity available versus capacity used, by engine and provider.</p></div>
<div class="module"><h3>Unit economics</h3><p>Cost per job, direct service costs and contribution margin from approved external records.</p></div>
<div class="module"><h3>Knowledge & innovation</h3><p>Knowledge preserved, tested solutions and innovations deployed.</p></div>
<div class="module"><h3>Human progress</h3><p>Evidence-backed outcomes and cross-sector collaboration.</p></div>
<div class="module"><h3>Exceptions & incidents</h3><p>Delayed or failed jobs, quality exceptions, safety events and recovery status.</p></div>
</div><p class="muted small" style="margin-top:12px">Every displayed metric must link to its evidence, source system, timestamp and auditable record. This prototype contains no live operational measurements.</p></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Shared platform control plane</h2></div><div class="grid layout3">
<div class="module"><h3>Identity & trust</h3><p>Identity, permissions, privacy and access controls</p></div><div class="module"><h3>Commercial coordination</h3><p>Demand, contracts, service definitions, pricing and provider eligibility</p></div><div class="module"><h3>AI orchestration</h3><p>Classify, route, monitor and coordinate agents, tools, people and devices</p></div>

</div></div>

<div class="module"><h3>06 · EXTERNAL COMMERCIAL ARRANGEMENTS</h3><p>Any commercial settlement occurs outside CEDARS transaction infrastructure</p></div><div class="module"><h3>07 · LEARN</h3><p>Reliability, feedback, unit economics, incidents and impact</p></div>
</div><p class="muted small" style="margin-top:12px">24/7 does not mean unsupervised. Human review, permissions, alerts, incident response and a kill switch remain essential.</p></div>

grids:{title:"Grid engine register",sub:"Original engine scope, revenue categories and existing module catalogue—kept distinct from runtime readiness.",html:`<div class="notice blue"><strong>Architecture register · not a live-service count</strong>This register preserves the original engine scope. VISION entries are strategic architecture; catalogue entries are present in the prototype. Neither label proves a connected or operational service. Local controls do not activate infrastructure.</div><div class="notice blue"><strong>Independent layer and Grid isolation</strong>Each of the four economic layers and every Grid has its own ON/OFF control. A Grid is effectively ON only when both its parent layer and its own Grid switch are ON. Turning a layer OFF immediately isolates all child Grids without erasing their individual switch settings; turning the layer back ON restores only the Grids whose own switches remain ON. Other layers continue independently. These are local prototype controls only and do not activate infrastructure.</div><div class="grid-tools"><label for="gridSearch">Find a Grid, service or evidence requirement</label><input id="gridSearch" type="search" placeholder="Search all four layers..." autocomplete="off"><p class="small muted">Each Grid has its own desired state and a verification / maintenance checklist. Status remains OFF or unverified until evidence-based acceptance.</p></div><div id="layerCards"></div>`},

wallet:{title:"Wallet Grid",sub:"Non-fiat wallet identity and permitted ledger-reference interface.",html:`<div class="notice red"><strong>Non-fiat architecture</strong>No deposits, withdrawals, payment rails, cash balances or fiat settlement. Any example balance is illustrative only and is not a claim on funds.</div><div class="grid stats"><div class="card"><div class="statlabel">Wallet service</div><div class="statvalue">OFF</div><div class="statnote">Integration not connected</div></div><div class="card"><div class="statlabel">Wallet identities</div><div class="statvalue">—</div><div class="statnote">No live Preview records</div></div><div class="card"><div class="statlabel">Transactions</div><div class="statvalue">0</div><div class="statnote">No financial execution</div></div><div class="card"><div class="statlabel">Fiat support</div><div class="statvalue">NO</div><div class="statnote">Architecturally prohibited</div></div></div><div class="card" style="margin-bottom:15px"><div class="cardhead"><h2>Balance overview</h2><span class="pill amber">NO LIVE DATA</span></div><div class="notice blue"><strong>What a balance means in CEDARS</strong>A balance is a calculated position from verified, non-fiat ledger records. It is not cash, stored money, a deposit, a withdrawal entitlement or a promise of redemption. No currency symbol or fiat denomination is used.</div><div class="grid layout3"><div class="module"><h3>Available position</h3><div class="statvalue">—</div><p class="muted small">Verified non-fiat value currently eligible for an approved use, if the applicable rules allow it.</p></div><div class="module"><h3>Reserved position</h3><div class="statvalue">—</div><p class="muted small">Non-fiat value earmarked for an approved, pending purpose; not available for other allocation.</p></div><div class="module"><h3>Ledger position</h3><div class="statvalue">—</div><p class="muted small">Net position calculated from validated ledger entries and traceable adjustments.</p></div></div><div class="healthrow"><span>Pending entries awaiting verification</span><b>—</b></div><div class="healthrow"><span>Data source</span><span class="pill amber">PREVIEW LEDGER NOT CONNECTED</span></div><div class="healthrow"><span>Last verified at</span><b>—</b></div><p class="muted small" style="margin:12px 0 0">Values remain blank until the Preview database, ledger schema, calculation rules and source records pass verification. Demonstration balances must never be presented as real.</p></div><div class="card"><h2>Wallet capability boundaries</h2><div class="healthrow">Identity and ownership references <span class="pill blue">DESIGN SCOPE</span></div><div class="healthrow">Non-fiat contribution records <span class="pill blue">DESIGN SCOPE</span></div><div class="healthrow">Cash deposit / withdrawal <span class="pill red">PROHIBITED</span></div><div class="healthrow">Payment and settlement rails <span class="pill red">PROHIBITED</span></div></div>`},

reliability:{title:"Reliability & Resilience",sub:"CEDARS-RELIABILITY-001 · A cross-platform assurance framework and verification register.",html:`
<div class="notice blue"><strong>Preservation rule · additive update only</strong>This framework supplements the existing prototype. It does not remove or replace existing grids, modules, workers, customer flows or vision layers. All controls shown here are illustrative until connected to verified services. The 20× ambition is a target for measurable comparison—not a current performance claim.</div>
<div class="grid stats">
 <div class="card"><div class="statlabel">Critical reliability domains</div><div class="statvalue">10</div><div class="statnote">Proposed assurance domains</div></div>
 <div class="card"><div class="statlabel">Target critical availability</div><div class="statvalue">99.99%</div><div class="statnote">Proposed SLO · not measured</div></div>
 <div class="card"><div class="statlabel">Production release gates</div><div class="statvalue">100%</div><div class="statnote">Must pass with evidence before LIVE</div></div>
 <div class="card"><div class="statlabel">Current assurance status</div><div class="statvalue" style="font-size:20px">NOT VERIFIED</div><div class="statnote">No reliability certification implied</div></div>
</div>
<div class="card"><div class="cardhead"><h2>Ten reliability and resilience domains</h2><span class="pill blue">REQUIREMENTS</span></div>
<div class="grid layout2">
 <div class="module"><h3>01 · No single point of failure</h3><p>Identify critical dependencies; design tested redundancy, failover and isolation for compute, network, identity and data.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>02 · Zero-trust security</h3><p>Strong identity, least privilege, service-to-service authorization, short-lived credentials, secrets rotation and continuous access checks.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>03 · Backup and recovery</h3><p>Encrypted independent backups, defined retention, recovery-point and recovery-time objectives, and recurring restore drills.</p><span class="pill amber">RESTORE TEST REQUIRED</span></div>
 <div class="module"><h3>04 · Data integrity and audit</h3><p>Append-only audit evidence, integrity checks, provenance, versioning, idempotency and traceable corrections.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>05 · AI worker safety</h3><p>Scoped tools, permission boundaries, budget limits, output validation, prompt-injection defenses, human escalation and kill switch.</p><span class="pill amber">RUNTIME NOT CONNECTED</span></div>
 <div class="module"><h3>06 · Graceful failure</h3><p>Timeouts, bounded retries, circuit breakers, dead-letter queues, duplicate prevention and safe degraded modes.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>07 · Independent governance</h3><p>Separation of duties, no self-approval for high-risk actions, reason capture, quorum and immutable approval evidence.</p><span class="pill amber">POLICY / VERIFY</span></div>
 <div class="module"><h3>08 · Continuous testing</h3><p>Automated regression, security tests, dependency scans, penetration testing, load testing and controlled failure simulation.</p><span class="pill amber">TEST EVIDENCE REQUIRED</span></div>
 <div class="module"><h3>09 · Privacy and identity recovery</h3><p>Data minimization, encryption, consent, secure account recovery, access review, export and deletion workflows.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>10 · Operational intelligence</h3><p>Service-level indicators, distributed traces, logs, alerting, incident ownership, status communication and post-incident learning.</p><span class="pill amber">OBSERVABILITY GAP</span></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Reliability verification coverage</h2><span class="pill amber">OPEN REGISTER</span></div>
<p class="muted small">These are verification categories to complete across the three agreed workstreams. “Not verified” means evidence is still required; it does not mean a feature is absent.</p>
<div class="tablewrap"><table><thead><tr><th>Workstream</th><th>Coverage required</th><th>Evidence required</th><th>Status</th></tr></thead><tbody>
<tr><td><b>Customer Portal</b></td><td>Identity, session security, account recovery, privacy, API authorization, service continuity, support escalation</td><td>Authenticated end-to-end tests, access-denial tests, recovery drills, privacy checks</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>Admin</b></td><td>RBAC, separation of duties, approvals, audit integrity, secrets, configuration safety, emergency disable</td><td>Role matrix tests, unauthorized-action denials, approval evidence, audit integrity checks</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>Command Centre</b></td><td>Health/readiness, observability, dependency map, failover, backup restoration, incident response, SLOs</td><td>Runtime probes, restore reports, controlled failure drills, alert and recovery records</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>AI workers & Grids</b></td><td>Worker identity, scoped tools, budgets, task idempotency, output validation, human override</td><td>Controlled task runs, adversarial tests, cost records, execution traces and kill-switch test</td><td><span class="pill amber">RUNTIME NOT CONNECTED</span></td></tr>
<tr><td><b>Shared infrastructure</b></td><td>Database, network, provider APIs, deployment, backups, encryption and recovery dependencies</td><td>Dependency inventory, security review, resilience and restoration test results</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
</tbody></table></div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Proposed service-level objectives</h2><span class="pill blue">TARGETS ONLY</span></div><div class="tablewrap"><table><thead><tr><th>Measure</th><th>Proposed target</th><th>How it is proven</th></tr></thead><tbody>
<tr><td>Critical service availability</td><td>99.99%</td><td>Monthly SLI from independent monitoring, excluding only documented maintenance under an approved policy</td></tr>
<tr><td>Critical data integrity</td><td>Zero acknowledged records lost</td><td>Reconciliation, integrity checks and recovery-point evidence</td></tr>
<tr><td>Critical service recovery</td><td>Within 5 minutes where architecture permits</td><td>Timed failover drills; publish actual results and scope</td></tr>
<tr><td>Privileged unauthorized actions</td><td>Zero accepted</td><td>Negative authorization tests and audit review</td></tr>
<tr><td>Untraceable privileged changes</td><td>Zero</td><td>Independent audit completeness checks</td></tr>
<tr><td>Duplicate approved task execution</td><td>Zero unintended duplicates</td><td>Idempotency and replay tests</td></tr>
<tr><td>Critical backup restore tests</td><td>100% pass</td><td>Scheduled restore drills with signed evidence</td></tr>
<tr><td>Critical release gates</td><td>100% pass before LIVE</td><td>Evidence-linked release acceptance; fail closed</td></tr>
</tbody></table></div><div class="notice">Targets are proposed engineering objectives, not claims about current CEDARS performance. Availability and recovery targets must be validated against architecture, cost and actual operating requirements.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>20× reliability measurement protocol</h2><span class="pill amber">NOT YET SCORED</span></div><p>Do not assign a 20× score using arbitrary weights. Define comparable measures, a fixed observation window, independent data sources and a baseline. For each measure, calculate the improvement using the same definition and scope. For failure rates, compare the reduction in rate; for availability, compare downtime or failed-request rates. Publish confidence, exclusions and test conditions.</p><div class="healthrow"><b>Bitcoin comparison</b><span class="pill blue">PROTOCOL / NETWORK SCOPE ONLY</span></div><div class="healthrow"><b>CEDARS comparison</b><span class="pill amber">BASELINE NOT ESTABLISHED</span></div><div class="healthrow"><b>Independent validation</b><span class="pill amber">REQUIRED</span></div></div>
<div class="notice red" style="margin-top:15px"><strong>Governance boundaries remain unchanged</strong>Preview-only development. Production FROZEN. Public launch OFF. Financial execution OFF. NO FIAT TRANSACTIONS. This page does not activate infrastructure, change live settings or authorize deployment to Production.</div>`},

function renderLayeredGridRegistry(){

erification record.</p></details></div></article>';

function openPage(page){const p=pages[page]||pages.overview;document.getElementById("crumb").textContent=p.title;document.querySelectorAll("#nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML='<div class="pagehead"><div><div class="eyebrow">CEDARS OS™ · COMMAND CENTER</div><h1>'+p.title+'</h1></div><div class="actions"><button class="btn primary" id="refreshBtn">↻ Refresh</button></div></div>'+p.html+'';if(page==="register")initializeRegistrationPhone();if(page==="login"){initializeAuth0();const loginButton=document.getElementById("auth0Login");const refreshButton=document.getElementById("auth0Refresh");const logoutButton=document.getElementById("auth0Logout");if(loginButton)loginButton.onclick=startAuth0Login;if(refreshButton)refreshButton.onclick=refreshAuth0Session;if(logoutButton)logoutButton.onclick=endAuth0Session;renderAuth0Session();}if(page==="grids")renderLayeredGridRegistry();if(page==="modules")renderCards("moduleCards",moduleData,"module");if(page==="workers")renderCards("workerCards",workerData,"worker");if(page==="tasks"){populateTaskGridOptions();renderTasks();}document.getElementById("refreshBtn").onclick=()=>{if(page==="overview")refreshOverviewEvidence();else showToast("Prototype view refreshed. No external data was requested.");};if(page==="overview"){const evidenceButton=document.getElementById("refreshEvidenceBtn");if(evidenceButton)evidenceButton.onclick=refreshOverviewEvidence;refreshOverviewEvidence();}}
async function refreshOverviewEvidence(){
 const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value??"unknown";};
 const label=(value)=>String(value??"unknown").replace(/_/g," ").toUpperCase();
 set("runtimeEvidenceStatus","CHECKING");
 set("evidenceError","");
 for(const id of ["evidenceApi","evidenceDatabase","evidenceIdentity","evidenceGrids","evidenceModules","evidenceWorkers"])set(id,"CHECKING");
 const request=async(path)=>{const response=await fetch(path,{method:"GET",headers:{Accept:"application/json"},cache:"no-store",credentials:"same-origin"});let body={};try{body=await response.json();}catch{}return {ok:response.ok,status:response.status,body};};
 try{
  const results=await Promise.all([request("/api/health"),request("/api/ready")]);
  const health=results[0],ready=results[1],h=health.body||{},r=ready.body||{},c=r.components||{};
  set("evidenceApi",health.ok&&h.status==="ok"?"AVAILABLE":"UNAVAILABLE");
  set("evidenceApiDetail","HTTP "+health.status+" · "+label(h.service||"service unknown"));
  set("evidenceDatabase",label(c.database||"not reported"));
  set("evidenceDatabaseDetail",ready.status===503&&c.database==="unavailable"?"Database connection not available":"Readiness HTTP "+ready.status);
  set("evidenceIdentity",label(c.identity||"not reported"));
  set("evidenceIdentityDetail","Identity configuration only; no user session is implied");
  set("evidenceGrids",label(c.gridControlPlane||"not reported"));
  set("evidenceGridsDetail",(r.grids?.configured??"—")+" / "+(r.grids?.expected??"—")+" configured");
  set("evidenceModules",label(c.moduleControlPlane||"not reported"));
  set("evidenceModulesDetail",(r.modules?.configured??"—")+" / "+(r.modules?.expected??"—")+" configured");
  set("evidenceWorkers",label(c.workerRuntime||"not reported"));
  set("evidenceWorkersDetail",(r.workers?.configured??"—")+" / "+(r.workers?.expected??"—")+" configurations");
  set("evidenceObservedAt",r.observedAt||new Date().toISOString());
  set("runtimeEvidenceStatus",health.ok&&ready.ok&&r.status==="ready"?"READINESS CHECK PASSED":"READINESS NOT PASSED");
  if(!health.ok||!ready.ok)set("evidenceError","One or more checks returned a non-success HTTP status. Review the observed component results; no LIVE status is inferred.");
 }catch(error){
  set("runtimeEvidenceStatus","CHECK FAILED");
  set("evidenceError","Runtime evidence could not be retrieved. "+(error instanceof Error?error.message:"Network error"));
  set("evidenceObservedAt",new Date().toISOString());
 }
}
async function initializeAuth0(){
 const status=document.getElementById("auth0Status");
 if(!window.auth0||typeof window.auth0.createAuth0Client!=="function"){
  if(status)status.textContent="AUTH0 SDK UNAVAILABLE";
  const message=document.getElementById("auth0Message");if(message)message.textContent="The Auth0 browser SDK did not load. Check network access and refresh; no credentials were collected.";
  return;
 }
 try{
  if(!auth0Client){
   auth0Client=await window.auth0.createAuth0Client({
    domain:AUTH0_CONFIG.domain,
    clientId:AUTH0_CONFIG.clientId,
    cacheLocation:"memory",
    useRefreshTokens:false,
    authorizationParams:{redirect_uri:window.location.origin+"/hybrid-preview.html",audience:AUTH0_CONFIG.audience,scope:"openid profile email"}
   });
  }
  if(window.location.search.includes("code=")&&window.location.search.includes("state=")){
   await auth0Client.handleRedirectCallback();
   window.history.replaceState({},document.title,window.location.pathname);
  }
  const authenticated=await auth0Client.isAuthenticated();
  auth0User=authenticated?await auth0Client.getUser():null;
  auth0AccessToken=authenticated?await auth0Client.getTokenSilently():null;
  renderAuth0Session();
 }catch(error){
  auth0AccessToken=null;auth0User=null;
  const message=document.getElementById("auth0Message");
  if(message)message.textContent="Auth0 could not complete session initialization. "+(error&&error.message?error.message:"Check the allowed callback URL and tenant settings.");
  if(status)status.textContent="SESSION NOT VERIFIED";
 }
}
function renderAuth0Session(){
 const status=document.getElementById("auth0Status");
 const identity=document.getElementById("auth0Identity");
 const message=document.getElementById("auth0Message");
 const login=document.getElementById("auth0Login");
 const logout=document.getElementById("auth0Logout");
 if(status)status.textContent=auth0User&&auth0AccessToken?"AUTHENTICATED · TOKEN IN MEMORY":"NOT SIGNED IN";
 if(identity)identity.textContent=auth0User?(auth0User.email||auth0User.name||"Verified Auth0 identity"):"Not signed in";
 if(message&&auth0User)message.textContent="Auth0 session established. CEDARS API authorization and role enforcement remain separate checks; no elevated role is inferred.";
 if(login)login.disabled=!!auth0User;
 if(logout)logout.disabled=!auth0User;
}
async function startAuth0Login(){
 try{
  if(!auth0Client)await initializeAuth0();
  if(!auth0Client)throw new Error("Auth0 SDK is not ready.");
  await auth0Client.loginWithRedirect({authorizationParams:{redirect_uri:window.location.origin+"/hybrid-preview.html",audience:AUTH0_CONFIG.audience,scope:"openid profile email"}});
 }catch(error){showToast("Auth0 sign-in could not start: "+(error&&error.message?error.message:"unknown error"));}
}
async function refreshAuth0Session(){
 await initializeAuth0();
 if(auth0User)showToast("Auth0 session refreshed. API role acceptance is not implied.");
}
async function endAuth0Session(){
 if(!auth0Client){showToast("No active Auth0 session.");return;}
 auth0AccessToken=null;auth0User=null;
 await auth0Client.logout({logoutParams:{returnTo:window.location.origin+"/hybrid-preview.html"}});
}
window.cedarsAuthenticatedFetch=async function(url,options={}){
 if(!auth0Client)throw new Error("Auth0 session is not initialized.");
 const token=await auth0Client.getTokenSilently();
 const headers=new Headers(options.headers||{});
 headers.set("Authorization","Bearer "+token);
 return fetch(url,{...options,headers});
};
