<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>ROBOT GRID OS | Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #16231d;
      --muted: #6e7d75;
      --line: #dfe6df;
      --paper: #edf1ee;
      --surface: #f7faf7;
      --rail: #111c18;
      --rail-muted: #91a29a;
      --green: #2b7a5a;
      --green-soft: #e8f6ee;
      --orange: #d66a45;
      --orange-soft: #fff0e9;
      --blue: #3d6c82;
      --blue-soft: #ebf5f8;
      --red: #ba5349;
      --shadow: 0 1px 2px rgb(15 27 22 / 5%), 0 18px 32px rgb(18 33 27 / 8%);
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgb(32 57 43 / 2%) 1px, transparent 1px), linear-gradient(90deg, rgb(32 57 43 / 2%) 1px, transparent 1px);
      background-size: 32px 32px;
      min-height: 100vh;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #e8a455; outline-offset: 3px; }
    .app-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: var(--rail);
      color: #f7faf7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 26px 15px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 26px; }
    .brand-mark {
      width: 35px;
      height: 35px;
      background: linear-gradient(135deg, #d8efdf, #7ec59d);
      border-radius: 10px 10px 10px 3px;
      color: var(--rail);
      display: grid;
      place-items: center;
      font: 700 17px "Space Grotesk", sans-serif;
      transform: rotate(-4deg);
      box-shadow: inset 0 0 0 2px rgba(23, 36, 30, 0.08);
    }
    .brand-name { font: 700 17px "Space Grotesk", sans-serif; letter-spacing: 0; }
    .robot-scene {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
      margin: 18px 0 24px;
    }
    .robot-stage {
      background: radial-gradient(circle at 50% 16%, rgba(115, 247, 184, 0.28), rgba(3, 7, 7, 0.96) 32%, rgba(6, 13, 11, 1) 74%), linear-gradient(180deg, rgba(9, 18, 15, 0.97), rgba(11, 17, 15, 0.96));
      border: 1px solid rgba(196, 224, 212, 0.18);
      border-radius: 24px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 36px 72px rgba(2, 6, 5, 0.42), 0 0 52px rgba(120, 225, 171, 0.18);
      min-height: 290px;
      overflow: hidden;
      padding: 20px 18px;
      position: relative;
      isolation: isolate;
    }
    .robot-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(124, 181, 146, 0.09), transparent 16%, transparent 84%, rgba(124, 181, 146, 0.08)),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.028), rgba(255,255,255,0.028) 2px, transparent 2px, transparent 5px);
      pointer-events: none;
      z-index: 0;
    }
    .robot-stage::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 6px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(154, 253, 197, 0.58), rgba(137, 204, 161, 0.32) 32%, rgba(137, 204, 161, 0) 68%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
    }
    .robot-work {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 18px;
      min-height: 155px;
      padding-top: 8px;
      filter: saturate(1.1);
    }
    .robot-work::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 14px;
      bottom: 0;
      border-radius: 20px;
      background: linear-gradient(90deg, transparent, rgba(133, 168, 150, 0.08), transparent);
      background-size: 200% 100%;
      animation: scanline 5s linear infinite;
      pointer-events: none;
    }
    @keyframes scanline {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .robot-stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
    }
    .robot-stage-header strong {
      font: 700 14px "Space Grotesk", sans-serif;
      color: var(--ink);
      text-shadow: 0 0 18px rgba(139, 214, 170, 0.2);
      letter-spacing: 0.06em;
      filter: drop-shadow(0 0 10px rgba(126, 220, 170, 0.14));
      transform: scale(1.04);
    }
    .robot-tag {
      background: rgba(35, 123, 88, 0.08);
      color: var(--green);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(94, 210, 137, 0.14);
    }
        .robot-work { position: relative; z-index: 1; display: flex; align-items: end; justify-content: center; gap: 18px; min-height: 155px; }
    .robot-pack {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 16px;
      padding: 18px 24px 0;
      border-radius: 38px;
      background: radial-gradient(circle at 50% 18%, rgba(138, 255, 196, 0.4), rgba(10, 16, 15, 0.98) 40%, rgba(5, 11, 10, 1) 80%);
      border: 1px solid rgba(208, 232, 220, 0.22);
      min-width: 680px;
      height: 286px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(111, 198, 160, 0.5), inset 0 -12px 30px rgba(8, 19, 17, 0.68), 0 30px 56px rgba(4, 9, 8, 0.44), 0 0 54px rgba(118, 215, 165, 0.34);
    }
    .robot-pack::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(8, 24, 20, 0.38), rgba(8, 24, 20, 0.14), rgba(8, 24, 20, 0.38));
      box-shadow: 0 0 22px rgba(111, 198, 160, 0.18);
    }
    .robot-pack::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 20px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(120, 220, 169, 0.62), transparent);
      filter: blur(14px);
    }
    .robot {
      --robot-scale: 2.08;
      position: relative;
      width: 156px;
      height: 252px;
      animation: robot-bob 3s ease-in-out infinite;
      filter: drop-shadow(0 30px 30px rgba(8, 18, 16, 0.28));
      transform-origin: center bottom;
    }
    .robot.small {
      --robot-scale: 1.2;
      width: 106px;
      height: 186px;
    }
    .robot.invert .head,
    .robot.invert .body,
    .robot.invert .arm,
    .robot.invert .leg {
      background: linear-gradient(180deg, #d8e4e0, #b4c5bc);
      border-color: #5e756a;
    }
    .robot:nth-child(2) { animation-delay: 0.4s; }
    .robot:nth-child(3) { animation-delay: 0.8s; }
    .robot-assembly-console {
      width: 112px;
      height: 138px;
      background: linear-gradient(180deg, rgba(250,255,252,0.78), rgba(191,216,203,0.8));
      border: 1px solid rgba(93, 111, 102, 0.2);
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(17, 27, 22, 0.04), 0 16px 24px rgba(8, 19, 16, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    .status-pulse {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(180deg, #9ef0bd, #5fd38a);
      box-shadow: 0 0 0 0 rgba(95, 211, 138, 0.8), 0 0 14px rgba(95, 211, 138, 0.9);
      animation: pulse 2.1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(127, 191, 156, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(127, 191, 156, 0); }
      100% { box-shadow: 0 0 0 0 rgba(127, 191, 156, 0); }
    }
    .console-lights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 56px;
    }
    .console-lights span {
      display: block;
      height: 9px;
      border-radius: 999px;
      background: rgba(40, 94, 66, 0.15);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }
    .console-lights span:nth-child(2n) { background: linear-gradient(90deg, rgba(58, 149, 103, 0.55), rgba(92, 204, 134, 0.8)); }
    .console-lights span:nth-child(3n) { background: linear-gradient(90deg, rgba(74, 120, 201, 0.48), rgba(82, 176, 166, 0.78)); }
    @keyframes robot-bob {
      0%, 100% { transform: translateY(0px) scale(var(--robot-scale)); }
      20% { transform: translateY(-10px) rotate(-1.4deg) scale(var(--robot-scale)); }
      50% { transform: translateY(-16px) rotate(1.4deg) scale(var(--robot-scale)); }
      80% { transform: translateY(-8px) rotate(-1deg) scale(var(--robot-scale)); }
    }
    @keyframes arm-sweep-left {
      0%, 100% { transform: rotate(22deg) scaleY(1.04); }
      20% { transform: rotate(36deg) scaleY(1.08); }
      50% { transform: rotate(68deg) scaleY(1.18); }
      80% { transform: rotate(42deg) scaleY(1.12); }
    }
    @keyframes arm-sweep-right {
      0%, 100% { transform: rotate(-22deg) scaleY(1.04); }
      20% { transform: rotate(-36deg) scaleY(1.08); }
      50% { transform: rotate(-68deg) scaleY(1.18); }
      80% { transform: rotate(-42deg) scaleY(1.12); }
    }
    @keyframes leg-sway-left {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-2px) rotate(-3deg); }
      50% { transform: translateX(-5px) rotate(3deg); }
      75% { transform: translateX(-2px) rotate(-2deg); }
    }
    @keyframes leg-sway-right {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(2px) rotate(3deg); }
      50% { transform: translateX(5px) rotate(-3deg); }
      75% { transform: translateX(2px) rotate(2deg); }
    }
    .robot .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 104px;
      height: 80px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #edf5f1, #b7cfc6);
      border: 4px solid #5e7069;
      border-radius: 15px 15px 12px 12px;
      box-shadow: inset 0 0 0 3px rgba(12, 20, 16, 0.06), 0 0 22px rgba(125, 211, 165, 0.2), 0 0 38px rgba(143, 232, 177, 0.18), 0 0 46px rgba(153, 239, 182, 0.1), 0 0 42px rgba(147, 255, 189, 0.16);
    }
    .robot .head::before, .robot .head::after {
      content: "";
      position: absolute;
      top: 18px;
      width: 12px;
      height: 12px;
      background: linear-gradient(180deg, #ffe4b0, #f59d5d);
      border-radius: 3px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.38), 0 0 14px rgba(245,157,93,1), 0 0 28px rgba(234,140,86,0.8), 0 0 38px rgba(255, 180, 96, 0.4);
      animation: eyeGlow 1.8s ease-in-out infinite;
    }
    @keyframes eyeGlow {
      0%, 100% { filter: brightness(0.9); }
      50% { filter: brightness(1.45); }
    }
    .robot .head::before { left: 15px; }
    .robot .head::after { right: 15px; }
    .robot .antenna {
      position: absolute;
      left: 50%;
      top: -24px;
      width: 5px;
      height: 22px;
      background: #556860;
      transform: translateX(-50%);
      border-radius: 5px;
    }
    .robot .antenna::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -10px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd8a8, #e58e55);
      transform: translateX(-50%);
      box-shadow: 0 0 16px rgba(229, 142, 85, 0.9);
      animation: antennaPulse 1.8s ease-in-out infinite;
    }
    @keyframes antennaPulse {
      0%, 100% { transform: translateX(-50%) scale(0.95); }
      50% { transform: translateX(-50%) scale(1.15); }
    }
    .robot .head::before, .robot .head::after {
      animation: eyeGlow 1.8s ease-in-out infinite;
    }
    @keyframes eyeGlow {
      0%, 100% { filter: brightness(0.95); }
      50% { filter: brightness(1.35); }
    }
    .robot .body {
      position: absolute;
      left: 50%;
      top: 63px;
      width: 102px;
      height: 82px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #d6e5e0, #9fb5ae);
      border: 4px solid #5d6f68;
      border-radius: 14px;
      box-shadow: inset 0 0 16px rgba(17, 30, 25, 0.08), 0 0 24px rgba(126, 192, 160, 0.14), 0 0 30px rgba(130, 210, 167, 0.1), 0 0 34px rgba(135, 232, 181, 0.12);
    }
    .robot .panel {
      position: absolute;
      left: 50%;
      top: 79px;
      width: 46px;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 7px;
      background: linear-gradient(180deg, #ffb667, #d76c42);
      box-shadow: inset 0 0 0 2px rgba(66, 31, 18, 0.08), 0 0 16px rgba(215, 108, 66, 0.38);
      animation: panel-pulse 1.7s ease-in-out infinite;
    }
    @keyframes panel-pulse {
      0%, 100% { box-shadow: inset 0 0 0 2px rgba(66, 31, 18, 0.08), 0 0 14px rgba(215, 108, 66, 0.22); }
      50% { box-shadow: inset 0 0 0 2px rgba(66, 31, 18, 0.08), 0 0 22px rgba(215, 108, 66, 0.54); }
    }
    .robot .arm {
      position: absolute;
      top: 68px;
      width: 24px;
      height: 92px;
      background: linear-gradient(180deg, #d7dfdb, #9fabaa);
      border: 4px solid #506d67;
      border-radius: 12px;
      transform-origin: top center;
      box-shadow: inset 0 0 8px rgba(18, 31, 27, 0.06), 0 0 18px rgba(126, 192, 160, 0.12);
    }
    .robot .arm.left { left: 8px; animation: arm-sweep-left 2.2s ease-in-out infinite; }
    .robot .arm.right { right: 8px; animation: arm-sweep-right 2.2s ease-in-out infinite; }
    .robot .arm.left::after, .robot .arm.right::after {
      content: "";
      position: absolute;
      inset: auto 4px -8px 4px;
      height: 10px;
      border-radius: 999px;
      background: rgba(101, 180, 136, 0.18);
      box-shadow: 0 0 12px rgba(101, 180, 136, 0.4);
    }
    .robot .leg {
      position: absolute;
      bottom: 0;
      width: 26px;
      height: 62px;
      background: linear-gradient(180deg, #dfe7e3, #a0b0ab);
      border: 4px solid #586f68;
      border-radius: 12px;
      transform-origin: top center;
      box-shadow: inset 0 0 8px rgba(18, 31, 27, 0.06);
    }
    .robot .leg.left { left: 36px; animation: leg-sway-left 2.2s ease-in-out infinite; }
    .robot .leg.right { right: 36px; animation: leg-sway-right 2.2s ease-in-out infinite; }
    .robot .robot-socket {
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 22px;
      height: 22px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f4d3a3, #dd8d4c);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(221, 141, 76, 0.9), 0 0 22px rgba(245, 157, 93, 0.4);
    }
    .robot-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      position: relative;
      z-index: 1;
      margin-top: 8px;
    }
    .robot-card {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(95,115,104,0.18);
      border-radius: 10px;
      padding: 12px 12px 10px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      box-shadow: 0 10px 22px rgba(10, 22, 18, 0.08);
    }
    .robot-card .mini-robot {
      width: 46px;
      height: 52px;
      position: relative;
    }
    .robot-card .mini-robot .head,
    .robot-card .mini-robot .body,
    .robot-card .mini-robot .arm,
    .robot-card .mini-robot .leg {
      position: absolute;
    }
    .robot-card .mini-robot .head {
      width: 24px;
      height: 18px;
      left: 11px;
      top: 4px;
      border-width: 2px;
    }
    .robot-card .mini-robot .head::before,
    .robot-card .mini-robot .head::after { width: 4px; height: 4px; top: 7px; }
    .robot-card .mini-robot .body {
      width: 26px;
      height: 18px;
      left: 10px;
      top: 24px;
      border-width: 2px;
    }
    .robot-card .mini-robot .panel {
      width: 12px;
      height: 9px;
      top: 29px;
      left: 17px;
    }
    .robot-card .mini-robot .arm.left { left: 3px; top: 25px; height: 16px; }
    .robot-card .mini-robot .arm.right { right: 3px; top: 25px; height: 16px; }
    .robot-card .mini-robot .leg.left { left: 15px; top: 42px; }
    .robot-card .mini-robot .leg.right { right: 15px; top: 42px; }
    .robot-card strong { display: block; font-size: 11px; }
    .robot-card span { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .robot-card:hover {
      border-color: rgba(101, 181, 140, 0.4);
      box-shadow: 0 12px 28px rgba(11, 26, 21, 0.09);
    }
    .robot-workbench {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 20px 0 24px;
    }
    .robot-bay {
      background: linear-gradient(180deg, #f8faf8, #edf3ef);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }
    .robot-bay h3 {
      margin: 0 0 14px;
      font: 600 14px "Space Grotesk", sans-serif;
    }
    .robot-line {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      min-height: 120px;
      padding-top: 8px;
    }
    .robot-line .robot { transform: scale(0.84); }
    .robot-console {
      flex: 0 0 110px;
      height: 78px;
      border: 1px solid rgba(60,78,67,0.18);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(15,30,18,0.04), rgba(94,125,104,0.12));
      position: relative;
      overflow: hidden;
    }
    .robot-console::before {
      content: "";
      position: absolute;
      inset: 14px 14px auto 14px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #8fc8a8, #d9f0e2);
      box-shadow: 0 0 18px rgba(122,211,161,0.6);
    }
    .robot-console::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      height: 12px;
      border-radius: 999px;
      background: rgba(50,78,59,0.1);
    }
    @media (max-width: 760px) {
      .robot-scene, .robot-workbench { grid-template-columns: 1fr; }
      .robot-stage { min-height: 200px; }
    }

    .brand-mark {
      width: 35px;
      height: 35px;
      background: #d8efdf;
      border-radius: 10px 10px 10px 3px;
      color: var(--rail);
      display: grid;
      place-items: center;
      font: 700 17px "Space Grotesk", sans-serif;
      transform: rotate(-4deg);
    }
    .brand-name { font: 700 17px "Space Grotesk", sans-serif; letter-spacing: 0; }
    .brand-sub { color: var(--rail-muted); font-size: 10px; letter-spacing: 1.1px; margin-top: 3px; display: none; }
    .brand-mark.has-image { background: transparent; box-shadow: none; transform: none; }
    .brand-mark.has-image #brandFallback { display: none; }
    .brand-image { display: none; height: 100%; object-fit: contain; width: 100%; }
    .brand-mark.has-image .brand-image { display: block; }
    #removeLogoButton[hidden] { display: none; }
    .nav-caption { color: #7f9286; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; padding: 13px 12px 8px; display: none; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: #bdc9c1;
      cursor: pointer;
      display: flex;
      gap: 12px;
      min-height: 42px;
      padding: 0 12px;
      text-align: left;
      transition: background .18s ease, color .18s ease;
      width: 100%;
    }
    .nav-item:hover { background: rgb(255 255 255 / 7%); color: white; }
    .nav-item[aria-current="page"] { background: #263c30; color: #fff; box-shadow: inset 3px 0 #75bf8f; }
    .nav-glyph { color: #90b69b; font-size: 12px; font-weight: 700; width: 17px; text-align: center; }
    .nav-label { font-size: 13px; font-weight: 500; }
    .nav-count { color: #a7b5ab; font-size: 11px; margin-left: auto; }

    function randomBase64Url(size = 32) {

    async function getOidcConfig() {
      const response = await fetch("/api/auth/config", { cache: "no-store" });
      const config = await response.json();
      if (!response.ok) throw new Error(config.error || "Identity provider is not configured.");
      if (config.localDevelopment !== true && !config.pkceSupported) {
        throw new Error("Identity provider must support PKCE S256.");
      }
      return config;
    }

    async function startSignIn(signup = false) {
      const config = await getOidcConfig();
      if (config.localDevelopment === true) {
        if (signup) {
          showToast("Local development uses a seeded account; registration requires the configured identity provider.");
          return;
        }
        const response = await fetch("/api/auth/local-token", { method: "POST", cache: "no-store" });
        const tokens = await response.json();
        if (!response.ok || typeof tokens.access_token !== "string") {
          throw new Error(tokens.error || "Local sign-in failed.");
        }
        const expiresIn = Number(tokens.expires_in);
        if (!Number.isFinite(expiresIn) || expiresIn <= 0) {
          throw new Error("Local sign-in returned an invalid token lifetime.");
        }
        accessToken = tokens.access_token;
        identityToken = null;
        accessTokenExpiry = Date.now() + Math.max(0, expiresIn - 30) * 1000;
        try {
          await loadModules();
        } catch (error) {
          clearSession();
          throw error;
        }
        document.getElementById("currentUserStatus").textContent = currentRole || "Signed in";
        document.getElementById("authButton").textContent = "Sign out";
        render();
        showToast("Signed in with the local development account.");
        return;
      }
      const state = randomBase64Url();
      const verifier = randomBase64Url(48);
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
      sessionStorage.setItem("cedars_oidc_state", state);
      sessionStorage.setItem("cedars_oidc_verifier", verifier);

      const redirectUri = `${window.location.origin}${window.location.pathname}`;
      const params = new URLSearchParams({
        response_type: "code",
        client_id: config.clientId,
        audience: config.audience,
        redirect_uri: redirectUri,
        scope: "openid profile email",
        state,
        code_challenge: challenge,
        code_challenge_method: "S256"
      });
      if (signup) params.set("screen_hint", "signup");
      window.location.assign(`${config.authorizationEndpoint}?${params.toString()}`);
    }

    async function finishSignIn() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      const returnedState = url.searchParams.get("state");
      const providerError = url.searchParams.get("error");
      if (!code && !providerError) return;

      const expectedState = sessionStorage.getItem("cedars_oidc_state");
      const verifier = sessionStorage.getItem("cedars_oidc_verifier");
      sessionStorage.removeItem("cedars_oidc_state");
      sessionStorage.removeItem("cedars_oidc_verifier");
      window.history.replaceState({}, document.title, url.pathname);
      if (providerError) throw new Error("Identity provider sign-in was cancelled or denied.");
      if (!code || !returnedState || returnedState !== expectedState || !verifier) {
        throw new Error("Sign-in state validation failed. Please try again.");
      }

      const config = await getOidcConfig();
      const response = await fetch(config.tokenEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          client_id: config.clientId,
          audience: config.audience,
          code,
          redirect_uri: `${window.location.origin}${window.location.pathname}`,
          code_verifier: verifier
        })
      });
      const tokens = await response.json();
      if (!response.ok || typeof tokens.access_token !== "string") {
        throw new Error("Token exchange failed. Check identity provider client settings.");
      }
      const expiresIn = Number(tokens.expires_in);
      if (!Number.isFinite(expiresIn) || expiresIn <= 0) {
        throw new Error("Token exchange returned an invalid token lifetime.");
      }

      accessToken = tokens.access_token;
      identityToken = typeof tokens.id_token === "string" ? tokens.id_token : null;
      accessTokenExpiry = Date.now() + Math.max(0, expiresIn - 30) * 1000;
      try {
        await loadModules();
      } catch (error) {
        clearSession();
        throw error;
      }
      document.getElementById("currentUserStatus").textContent = currentRole || "Signed in";
      document.getElementById("authButton").textContent = "Sign out";
      render();
      showToast("Signed in. Permissions are loaded from the server-side user record.");
    }

    async function signOut() {
      const idTokenHint = identityToken;
      clearSession();
      try {
        const config = await getOidcConfig();
        if (config.localDevelopment === true || !config.logoutEndpoint) {
          showToast("Signed out locally. The identity-provider session may remain active.");
          return;
        }
        const logoutUrl = new URL(config.logoutEndpoint);
        logoutUrl.searchParams.set("client_id", config.clientId);
        logoutUrl.searchParams.set("post_logout_redirect_uri", `${window.location.origin}${window.location.pathname}`);
        if (idTokenHint) logoutUrl.searchParams.set("id_token_hint", idTokenHint);
        window.location.assign(logoutUrl.toString());
      } catch {
        showToast("Signed out locally, but provider logout could not be confirmed.");
      }
    }

    async function apiFetch(path, options = {}) {
      if (!accessToken || Date.now() >= accessTokenExpiry) {
        clearSession();
        throw new Error("Sign in to load protected production data.");
      }
      const response = await fetch(path, {
        ...options,
        cache: "no-store",
        headers: {
          ...options.headers,
          Authorization: `Bearer ${accessToken}`,
          ...(options.body ? { "Content-Type": "application/json" } : {})
        }
      });
      const result = await response.json();
      if (response.status === 401) signOut();
      if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
      return result;
    }

    function gridTaskRows() {
      if (gridTaskError) return `<tr><td colspan="7">${escapeHtml(gridTaskError)}</td></tr>`;
      if (!gridTasks) return `<tr><td colspan="7">Loading Grid Tasks…</td></tr>`;
      if (!gridTasks.length) return `<tr><td colspan="7">No Grid Tasks have been submitted.</td></tr>`;

      return gridTasks.map((task) => {
        const worker = workerConfigs?.find((item) => item.id === task.workerId);
        const workerName = worker?.name ?? task.workerId ?? "Unassigned";
        let actions = `<span class="value-muted">Awaiting next step</span>`;
        if (canManagePlatform() && task.status === "OPEN") {
          const workerOptions = workerConfigs?.map((item) => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.name)}</option>`).join("") ?? "";
          actions = `<div class="task-actions"><select aria-label="Worker for ${escapeHtml(task.title)}" data-task-worker="${escapeHtml(task.id)}"><option value="">Choose Worker</option>${workerOptions}</select><button class="terminal-action" type="button" data-grid-task-action="assign" data-task-id="${escapeHtml(task.id)}">Assign</button></div>`;
        } else if (canManagePlatform() && task.status === "ASSIGNED") {
          actions = `<button class="terminal-action" type="button" data-grid-task-action="start" data-task-id="${escapeHtml(task.id)}">Start work</button>`;
        } else if (canManagePlatform() && task.status === "IN_PROGRESS") {
          actions = `<div class="task-actions"><textarea aria-label="Delivery evidence for ${escapeHtml(task.title)}" data-task-evidence="${escapeHtml(task.id)}" maxlength="10000" placeholder="Evidence reference and review notes"></textarea><button class="terminal-action" type="button" data-grid-task-action="deliver" data-task-id="${escapeHtml(task.id)}">Record delivery</button></div>`;
        } else if (task.canAccept && task.status === "DELIVERED") {
          actions = `<button class="primary-button" type="button" data-grid-task-action="accept" data-task-id="${escapeHtml(task.id)}">Accept delivery</button>`;
        }
        if ((task.canAccept || canManagePlatform()) && ["OPEN", "ASSIGNED"].includes(task.status)) {
          actions += ` <button class="quiet-button" type="button" data-grid-task-action="cancel" data-task-id="${escapeHtml(task.id)}">Cancel</button>`;
        }
        const evidence = task.deliveryEvidence
          ? `<details><summary>Delivery evidence</summary><p>${escapeHtml(task.deliveryEvidence)}</p></details>`
          : "—";
        const statusClass = task.status === "ACCEPTED" ? "status-resolved" : task.status === "CANCELLED" ? "status-paused" : "status-open";
        return `<tr><td>${escapeHtml(task.gridId)}</td><td><strong>${escapeHtml(task.title)}</strong><small class="task-description">${escapeHtml(task.description)}</small><small class="task-description">Accept when: ${escapeHtml(task.acceptanceCriteria)}</small>${evidence}</td><td>${escapeHtml(task.agreedAmount)} ${escapeHtml(task.currency)}</td><td>${escapeHtml(workerName)}</td><td><span class="status-pill ${statusClass}">${escapeHtml(task.status)}</span></td><td><span class="status-pill status-paused">NOT RECORDED</span></td><td>${actions}</td></tr>`;
      }).join("");
    }

        output.textContent = "Enter an amount from $1 to $50,000.";
        return;
      }
      output.textContent = `Illustrative 10% amount: ${new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"

    function updateTreasuryScenario() {
      const startingAmount = document.getElementById("scenarioStartingAmount").valueAsNumber;
      const treasuryBalance = document.getElementById("scenarioTreasuryBalance").valueAsNumber;
      const durationDays = document.getElementById("scenarioDurationDays").valueAsNumber;
      const dailyOutput = document.getElementById("scenarioDailyResult");
      const monthlyOutput = document.getElementById("scenarioMonthlyResult");
      const stakeOutput = document.getElementById("scenarioStakeResult");
      const valuesValid = Number.isFinite(startingAmount) &&
        Number.isFinite(treasuryBalance) &&
        Number.isInteger(durationDays) &&
        startingAmount >= 0 && startingAmount <= 1e12 &&
        treasuryBalance >= 0 && treasuryBalance <= 1e12 &&
        durationDays >= 0 && durationDays <= 3650;

      if (!valuesValid) {
        dailyOutput.textContent = "Enter valid non-negative amounts and a whole duration from 0 to 3,650 days.";
        monthlyOutput.textContent = "Enter valid non-negative amounts and a whole duration from 0 to 3,650 days.";
        stakeOutput.textContent = "Enter valid non-negative amounts and a whole duration from 0 to 3,650 days.";
        return;
      }

      const formatUnits = (value) => new Intl.NumberFormat("en-US", {
        maximumFractionDigits: 8
      }).format(value);
      const dailyProjected = startingAmount * (1.01 ** durationDays);
      const completedPeriods = Math.floor(durationDays / 30);
      const monthlyProjected = startingAmount * (1.5 ** completedPeriods);
      const treasuryAllocation = treasuryBalance * 0.05;
      dailyOutput.textContent = `${formatUnits(dailyProjected)} units after ${durationDays} days · illustrative, not payable`;
      monthlyOutput.textContent = `${formatUnits(monthlyProjected)} units after ${completedPeriods} completed 30-day periods · illustrative, not payable`;
      stakeOutput.textContent = `${formatUnits(treasuryAllocation)} units as a one-time 5% allocation · not a yield or transfer`;
    }

    function reserveView() {
      const revenue = 10000000;
      const costs = 4000000;
      const reserve = 240000000;
      const decline = 80;
      const stressedRevenue = revenue * (1 - decline / 100);
      const netResult = stressedRevenue - costs;
      const reserveAfter = Math.max(0, reserve + netResult);
      const monthlyBurn = Math.max(0, costs - stressedRevenue);
      const runway = monthlyBurn ? `${(reserveAfter / monthlyBurn).toFixed(1)} months` : "No modeled burn";
      const reserveTarget = costs * 12;

    function buildAuditReportSummary(events) {
      const entries = Array.isArray(events) ? events : [];
      const actionCounts = new Map();
      const roleCounts = new Map();
      let protectionAlerts = 0;

      for (const entry of entries) {
        const action = String(entry?.action ?? "UNKNOWN");
        const role = String(entry?.actor?.role ?? "UNKNOWN");
        actionCounts.set(action, (actionCounts.get(action) ?? 0) + 1);
        roleCounts.set(role, (roleCounts.get(role) ?? 0) + 1);
        if (["MODULE_DISABLED", "MODULE_ENABLED", "GRID_UPDATED", "WORKER_UPDATED"].includes(action)) {
          protectionAlerts += 1;
        }
      }

      const topActions = [...actionCounts.entries()]
        .sort((left, right) => right[1] - left[1])
        .slice(0, 3)
        .map(([action, count]) => `${action} · ${count}`)
        .join(" | ") || "No actions recorded";

      const topRole = [...roleCounts.entries()].sort((left, right) => right[1] - left[1])[0];
      const dominantRole = topRole ? `${topRole[0]} · ${topRole[1]}` : "No role activity";

      return {
        total: entries.length,
        topActions,
        dominantRole,
        protectionAlerts
      };
    }

        const approvedRoles = new Set(request.decisions.filter((decision) => decision.decision === "APPROVE").map((decision) => decision.reviewerRole));

    function formatBaseUnits(value, decimals) {
      try {
        const amount = BigInt(value);
        const divisor = 10n ** BigInt(decimals);
        const whole = amount / divisor;
        const fraction = (amount % divisor).toString().padStart(decimals, "0").replace(/0+$/, "");
        return fraction ? `${whole}.${fraction}` : whole.toString();
      } catch {
        return "Invalid amount";
      }
    }

    function treasuryTransferRows(transfers) {
      if (!transfers?.length) return `<tr><td colspan="6">No matching native-coin transfers have been observed.</td></tr>`;
      return transfers.map((transfer) => {
        const config = treasuryMonitorData?.monitoring?.find((item) => item.chain === transfer.chain);
        const configuredAddress = String(config?.treasuryAddress ?? "");
        const isIncoming = transfer.chain === "TRON"
          ? transfer.toAddress === configuredAddress
          : transfer.toAddress.toLowerCase() === configuredAddress.toLowerCase();
        const decimals = transfer.asset === "TRX" ? 6 : 18;
        const observedAt = new Date(transfer.observedAt);
        return `<tr><td>${escapeHtml(transfer.chain)}</td><td>${escapeHtml(transfer.blockNumber)}</td><td><code>${escapeHtml(transfer.transactionHash)}</code></td><td>${isIncoming ? "IN" : "OUT"}</td><td>${escapeHtml(formatBaseUnits(transfer.amountBaseUnits, decimals))} ${escapeHtml(transfer.asset)}</td><td>${Number.isNaN(observedAt.getTime()) ? "—" : escapeHtml(observedAt.toLocaleString())}</td></tr>`;
      }).join("");
    }

    function renderTreasuryMonitor() {
      const status = document.getElementById("treasuryMonitorStatus");
      const rows = document.getElementById("treasuryTransferRows");
      const syncButton = document.getElementById("syncTreasuryButton");
      if (!status || !rows) return;
      if (treasuryMonitorError) {
        status.textContent = `Treasury observation service unavailable: ${treasuryMonitorError}`;
        rows.innerHTML = `<tr><td colspan="6">Ledger data unavailable.</td></tr>`;
        return;
      }
      if (!treasuryMonitorData) return;
      const monitorLines = treasuryMonitorData.monitoring.map((monitor) => {
        const cursor = treasuryMonitorData.cursors.find((item) => item.chain === monitor.chain);
        const errors = monitor.error ? ` · ${escapeHtml(monitor.error)}` : "";
        return `<div><strong>${escapeHtml(monitor.chain)}</strong> · ${escapeHtml(monitor.status)}${monitor.treasuryAddress ? ` · <code>${escapeHtml(monitor.treasuryAddress)}</code>` : ""}${monitor.confirmations ? ` · ${escapeHtml(monitor.confirmations)} confirmations` : ""}${cursor ? ` · scanned through block ${escapeHtml(cursor.lastScannedBlock)}` : ""}${errors}</div>`;
      }).join("");
      status.innerHTML = `${monitorLines}<div class="form-hint">Ledger mode: ${escapeHtml(treasuryMonitorData.ledgerMode)} · payable balances: no</div>`;
      rows.innerHTML = treasuryTransferRows(treasuryMonitorData.transfers);
      if (syncButton) syncButton.disabled = !canManagePlatform() || !treasuryMonitorData.monitoring.some((item) => item.configured);
    }

    function exportAuditCsv() {
      if (!auditEvents?.length) {
        showToast("No audit rows are available to export.");
        return;
      }
      const headers = ["time", "actorRole", "action", "entityType", "entityId", "payload"];
      const csvLines = [headers.join(",")];
      for (const entry of auditEvents) {
        const payload = JSON.stringify(entry.payload ?? {}).replace(/"/g, '""');
        const row = [
          new Date(entry.createdAt).toISOString(),
          (entry.actor?.role ?? "UNKNOWN").replace(/"/g, '""'),
          (entry.action ?? "").replace(/"/g, '""'),
          (entry.entityType ?? "").replace(/"/g, '""'),
          (entry.entityId ?? "").replace(/"/g, '""'),
          `"${payload}"`
        ].map((value) => typeof value === "string" && value.includes(",") ? `"${value}"` : value).join(",");
        csvLines.push(row);
      }
      const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `cedars-audit-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${auditEvents.length} audit rows as CSV.`);
    }

        const response = await fetch("/api/ready", { cache: "no-store" });

          const valueElement = document.getElementById(`${name}StatusValue`);

          valueElement.textContent = value === "available" || value === "connected" || value === "configured" ? "Ready" : "Not ready";

        updateStatus("database", components.database);
        updateStatus("identity", components.identity);
        observedAt.textContent = `Checked ${new Date(result.observedAt || Date.now()).toLocaleTimeString()}`;

      if (event.target.id === "gridTaskCreateForm") {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector("button[type='submit']");
        const task = Object.fromEntries(new FormData(form).entries());
        button.disabled = true;
        try {
          const result = await apiFetch("/api/tasks", {
            method: "POST",
            body: JSON.stringify(task)
          });
          if (result.actorRole) currentRole = result.actorRole;
          form.reset();
          await refreshGridTasks();
          showToast("Grid Task recorded. No payment or Worker execution was started.");
        } catch (error) {
          if (button.isConnected) button.disabled = false;
          showToast(error.message);
        }
        return;
      }
      if (event.target.id === "opportunityMapForm") {
        event.preventDefault();
        const type = document.getElementById("opportunityType").value;
        const challenge = document.getElementById("opportunityChallenge").value.trim();
        const region = document.getElementById("opportunityRegion").value.trim();
        if (!Object.hasOwn(opportunityPlaybooks, type) || challenge.length < 15 || challenge.length > 500) {
          showToast("Choose a challenge area and describe the need in 15–500 characters.");
          return;
        }
        opportunityChallenge = challenge;
        opportunityRegion = region.slice(0, 80);
        opportunityMapResult = { type, challenge, region: opportunityRegion };
        render(false);
        showToast("Opportunity map created locally. Validate demand and safeguards with the community.");
        return;
      }
      if (event.target.id === "communityMessageForm") {
        event.preventDefault();
        if (!canAccessCommunity()) {
          showToast("Only active fully funded demo accounts can post in the room.");
          return;
        }
        const input = document.getElementById("communityMessage");
        const text = input.value.trim();
        if (!text || text.length > 500) {
          showToast("Room messages must be between 1 and 500 characters.");
          return;
        }
        communityMessages.unshift({
          id: `message-${Date.now()}`,
          author: currentRole === "FOUNDER" ? "Founder · demo" : "Member · demo",
          text,
          time: new Date().toLocaleTimeString()
        });
        render(false);
        showToast("Posted to the shared demo room.");
        return;
      }
      if (event.target.id === "studioQuestionForm") {
        event.preventDefault();
        const input = document.getElementById("studioQuestion");
        const text = input.value.trim();
        if (!text || text.length > 240) {
          showToast("Questions must be between 1 and 240 characters.");
          return;
        }
        studioQuestions.unshift({
          id: `studio-question-${Date.now()}`,
          text,
          author: "Current demo participant",
          reviewed: false
        });
        render(false);
        showToast("Question added to the local demo Q&A queue.");
        return;
      }
      if (event.target.id !== "studioSessionForm") return;
      event.preventDefault();
      if (!["FOUNDER", "SUPER_ADMIN", "INVESTOR"].includes(currentRole)) {
        showToast("Your account cannot facilitate a demo training.");
        return;
      }
      const title = document.getElementById("studioTitle").value.trim();
      if (!title) {
        showToast("Enter a training title.");
        return;
      }
      const audience = document.getElementById("studioAudience").value;
      const time = document.getElementById("studioTime").value.trim() || "Schedule to be confirmed";
      studioSessions.unshift({
        id: `studio-${Date.now()}`,
        title,
        host: currentRole === "FOUNDER" ? "Founder Studio" : "Investor-led Studio",
        audience,
        time,
        attendees: 0
      });
      render(false);
      showToast("Demo training added locally. No invitations were sent.");
    });

    document.addEventListener("change", (event) => {
      if (event.target.id === "brandLogoInput") {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
          showToast("Choose a PNG, JPEG, or WebP image.");
          return;
        }
        if (file.size > 1024 * 1024) {
          showToast("Logo files must be 1 MB or smaller.");
          return;
        }
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          const dataUrl = String(reader.result ?? "");
          if (!/^data:image\/(png|jpeg|webp);base64,/.test(dataUrl)) {
            showToast("The selected image could not be read.");
            return;
          }
          try {
            localStorage.setItem(brandLogoStorageKey, dataUrl);
            applyBrandLogo(dataUrl);
            showToast("Logo saved in this browser only.");
          } catch {
            showToast("Could not save this logo in browser storage.");
          }
        });
        reader.addEventListener("error", () => showToast("The selected image could not be read."));
        reader.readAsDataURL(file);
        return;
      }
      if (event.target.id === "demoAccountSelector") {
        const account = demoMemberAccounts.find((item) => item.id === event.target.value);
        if (!account) return;
        currentDemoMemberId = account.id;
        joinedStudioSessions.clear();
        render(false);
      }
    });

    document.addEventListener("input", (event) => {
      const referralAmount = event.target.closest("[data-referral-amount]");
      if (referralAmount) updateReferralCalculator(referralAmount);
      if (event.target.closest("[data-treasury-scenario]")) updateTreasuryScenario();
    });

    document.addEventListener("click", async (event) => {
      if (event.target.id !== "syncTreasuryButton") return;
      const button = event.target;
      const status = document.getElementById("treasurySyncStatus");
      button.disabled = true;
      if (status) status.textContent = "Reading configured chain endpoints and recording confirmed observations…";
      try {
        const result = await apiFetch("/api/admin/treasury", { method: "POST", body: JSON.stringify({}) });
        treasuryMonitorData = result;
        treasuryMonitorError = null;
        if (result.actorRole) currentRole = result.actorRole;
        renderTreasuryMonitor();
        if (status) {
          status.textContent = result.sync.map((item) =>
            `${item.chain}: ${item.status}${item.scannedFrom ? ` · blocks ${item.scannedFrom}–${item.scannedTo}` : ""}${item.transfersRecorded ? ` · ${item.transfersRecorded} observations` : ""}`
          ).join(" | ");
        }
      } catch (error) {
        treasuryMonitorError = error.message;
        renderTreasuryMonitor();
        if (status) status.textContent = error.message;
      } finally {
        if (button.isConnected) button.disabled = !canManagePlatform() || !treasuryMonitorData?.monitoring?.some((item) => item.configured);
      }
    });

    updateTreasuryScenario();

    document.getElementById("authButton").addEventListener("click", async () => {
      try {
        if (accessToken) await signOut();
        else await startSignIn();
      } catch (error) {
        showToast(error.message);
      }
    });
    document.getElementById("registerButton").addEventListener("click", async () => {
      try {
        await startSignIn(true);
      } catch (error) {
        showToast(error.message);
      }
    });

    document.getElementById("uploadLogoButton").addEventListener("click", () => {
      document.getElementById("brandLogoInput").click();
    });
    document.getElementById("removeLogoButton").addEventListener("click", () => {
      try {
        localStorage.removeItem(brandLogoStorageKey);
        applyBrandLogo(null);
        showToast("Logo reset in this browser.");
      } catch {
        showToast("Could not reset the saved logo.");
      }
    });

    syncCommunityMembership();
    restoreBrandLogo();
    render();
    finishSignIn().catch((error) => showToast(error.message));
  </script>
</body>
</html>
