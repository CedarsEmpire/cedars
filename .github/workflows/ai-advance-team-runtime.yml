name: AI Advance Team Runtime Verification

on:
  pull_request:
    branches:
      - preview/hybrid-dashboard-prototype
    paths:
      - "ai-advance-team/runtime/**"
      - ".github/workflows/ai-advance-team-runtime.yml"
  push:
    branches:
      - "feat/ai-advance-team-runtime-preview"
    paths:
      - "ai-advance-team/runtime/**"
      - ".github/workflows/ai-advance-team-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ai-advance-team-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build and verify isolated Preview agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ai-advance-team/runtime
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install isolated runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Run runtime and security-boundary tests
        run: npm test

      - name: Run fail-closed orchestration self-check
        run: npm run self-check

      - name: Compile Eve agent runtime
        run: npm run build
