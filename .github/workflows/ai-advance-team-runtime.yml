name: AI Advance Team Runtime Verification

on:
  pull_request:
    paths:
      - "ai-advance-team/runtime/**"
      - ".github/workflows/ai-advance-team-runtime.yml"
  push:
    branches:
      - "feat/ai-advance-team-runtime-preview"
    paths:
      - "ai-advance-team/runtime/**"
      - ".github/workflows/ai-advance-team-runtime.yml"

permissions:
  contents: read

concurrency:
  group: ai-advance-team-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    name: Read-only runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai-advance-team/runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated runtime tests
        run: npm test
      - name: Run runtime self-check
        run: npm run self-check
