*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:var(--navy);color:#eaf0f8;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9be5d7,#3aa996);display:grid;place-items:center;color:#102436;font-weight:900;font-size:20px}.brand strong{font-size:16px;letter-spacing:.04em}.brand small{display:block;color:#9aabc1;font-size:10px;letter-spacing:.15em;margin-top:3px}.env{margin:0 5px;padding:11px;border:1px solid #30435a;border-radius:12px;background:#17283d}.env b{font-size:11px;letter-spacing:.1em;color:#b7c7da}.env p{margin:8px 0 0;color:#92a5bc;font-size:11px;line-height:1.5}.nav-label{padding:0 11px;color:#778ba5;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b8c6d8;text-align:left;padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:11px;font-size:13px}.nav button:hover,.nav button.active{background:#243a53;color:#fff}.nav .ico{width:18px;text-align:center;color:#8fabc7}.sidefoot{margin-top:auto;border-top:1px solid #2b3c51;padding:15px 10px 0;color:#91a4ba;font-size:11px;line-height:1.6}main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink)}.topright{display:flex;align-items:center;gap:12px}.pill{border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px}.pill.green{background:var(--tealbg);color:#087c68}.pill.amber{background:var(--amberbg);color:#9c650d}.pill.red{background:var(--redbg);color:#b33e48}.pill.blue{background:var(--bluebg);color:#365fae}.avatar{width:34px;height:34px;border-radius:50%;background:#e6edf8;color:#3d5c8e;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px 44px;max-width:1600px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--teal);font-weight:900;letter-spacing:.16em;text-transform:uppercase}.pagehead h1{font-size:25px;letter-spacing:-.04em;margin:6px 0}.pagehead p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#33445b;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.btn.primary{background:var(--navy2);color:white;border-color:var(--navy2)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow);min-width:0}.statlabel{color:var(--muted);font-size:11px;font-weight:700}.statvalue{font-size:27px;font-weight:800;letter-spacing:-.05em;margin:10px 0 5px}.statnote{font-size:11px;color:var(--muted)}.layout2{grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)}.layout3{grid-template-columns:repeat(3,minmax(0,1fr))}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.cardhead h2{font-size:14px;margin:0}.muted{color:var(--muted)}.small{font-size:11px}.healthrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.healthrow:first-of-type{border-top:0}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--teal);margin-right:8px}.dot.amber{background:#e0a53e}.dot.red{background:#d35a62}.bar{height:7px;border-radius:20px;background:#edf1f6;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal);border-radius:20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef1f5;white-space:nowrap}tr:last-child td{border-bottom:0}.modulegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.module{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}.moduletop{display:flex;justify-content:space-between;gap:10px}.module h3{font-size:13px;margin:0 0 5px}.module p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 14px}.seg{display:flex;background:#f1f4f8;padding:3px;border-radius:9px;gap:3px}.seg button{border:0;border-radius:7px;background:transparent;padding:6px 8px;font-size:10px;font-weight:800;color:#77849a;flex:1}.seg button.selected{background:#fff;color:var(--ink);box-shadow:0 1px 4px #dbe2eb}.notice{padding:13px 15px;border:1px solid #f1dba9;background:#fff9eb;color:#805b1d;border-radius:11px;font-size:12px;line-height:1.5;margin-bottom:15px}.notice strong{display:block;margin-bottom:3px}.notice.red{background:#fff2f2;border-color:#f2c9cc;color:#963d45}.notice.blue{background:#f0f5ff;border-color:#d7e2fb;color:#3b5e9d}.hidden{display:none!important}.activity{display:grid;gap:0}.activityitem{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.activityitem:last-child{border:0}.activityicon{width:30px;height:30px;border-radius:9px;background:#edf3ff;display:grid;place-items:center}.activityitem b{font-size:12px}.activityitem p{margin:3px 0 0;color:var(--muted);font-size:11px}.toggle{width:38px;height:22px;border-radius:20px;background:#c8d0dc;border:0;position:relative}.toggle:after{content:"";width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;left:3px;top:3px;transition:.18s}.toggle.on{background:var(--teal)}.toggle.on:after{left:19px}.empty{padding:30px;text-align:center;color:var(--muted)}.metricline{display:flex;align-items:center;justify-content:space-between;margin:11px 0;font-size:12px}.tag{font-size:10px;padding:4px 7px;border-radius:6px;background:#f0f3f7;color:#617087;font-weight:800}.footer-note{margin-top:18px;color:#8a96a8;font-size:10px;text-align:center}.toast{position:fixed;bottom:22px;right:22px;background:#15253a;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;z-index:20;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.mobile{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.modulegrid{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}}
@media(max-width:700px){.shell{grid-template-columns:1fr}aside{position:relative;height:auto;min-height:0;padding:13px}.brand{padding:0 4px}.env,.nav-label,.sidefoot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.top{position:relative;padding:0 15px;height:58px}.content{padding:20px 14px}.pagehead{display:block}.actions{margin-top:13px}.stats{gap:9px}.card{padding:13px}.modulegrid,.layout3{grid-template-columns:1fr}.statvalue{font-size:22px}}

<script>
const pages={
overview:{title:"Platform overview",sub:"A single operational view of the CEDARS hybrid platform.",html:`
<div class="notice"><strong>Preview governance is active</strong>All figures on this screen are demonstration data unless explicitly marked as verified runtime evidence. No fiat transactions, payments, withdrawals or financial execution are enabled.</div>
<div class="grid stats">
 <div class="card"><div class="statlabel">Economic layers</div><div class="statvalue">4</div><div class="statnote">Cloud · Earth & Surface · Underground · Human Business</div></div>
 <div class="card"><div class="statlabel">Revenue engine categories</div><div class="statvalue">7</div><div class="statnote">Original commercial service architecture</div></div>
 <div class="card"><div class="statlabel">Humanity Grid layers</div><div class="statvalue">10</div><div class="statnote">Full strategic architecture · not deployment count</div></div>
 <div class="card"><div class="statlabel">AI worker catalogue</div><div class="statvalue">8</div><div class="statnote">Prototype entries only · runtime not connected</div></div>
</div>
<div class="grid layout2">
 <section class="card"><div class="cardhead"><h2>Platform service health</h2><span class="pill amber">PARTIAL</span></div>
  <div class="healthrow"><span><i class="dot"></i>API health endpoint</span><span class="pill green">VERIFIED · HTTP 200</span></div>
  <div class="healthrow"><span><i class="dot amber"></i>Preview database</span><span class="pill amber">CONNECTION PENDING</span></div>
  <div class="healthrow"><span><i class="dot amber"></i>Authentication</span><span class="pill amber">NOT ACCEPTED</span></div>
  <div class="healthrow"><span><i class="dot amber"></i>Grid service integrations</span><span class="pill amber">NOT CONNECTED</span></div>
  <div class="healthrow"><span><i class="dot amber"></i>Autonomous worker runtime</span><span class="pill amber">NOT IMPLEMENTED</span></div>
 </section>
 <section class="card"><div class="cardhead"><h2>Governance status</h2><span class="pill green">CONTROLLED</span></div>
  <div class="metricline"><span>Production environment</span><b class="pill red">OFF</b></div><div class="metricline"><span>Public launch</span><b class="pill red">OFF</b></div><div class="metricline"><span>Financial execution</span><b class="pill red">OFF</b></div><div class="metricline"><span>Fiat transactions</span><b class="pill red">PROHIBITED</b></div><div class="metricline"><span>Preview governance</span><b class="pill green">ACTIVE</b></div>
 </section>
</div>
<div class="grid layout2" style="margin-top:15px">
 <section class="card"><div class="cardhead"><h2>Milestone acceptance</h2><span class="muted small">Evidence-led progress</span></div>
  ${["M1 · Preview Foundation","M2 · Working Backend","M3 · Working Dashboard","M4 · Module Integration","M5 · Platform Verification"].map((x,i)=>`<div class="metricline"><span>${x}</span><span class="pill ${i===0?"amber":"blue"}">${i===0?"IN PROGRESS":"NOT STARTED"}</span></div>`).join("")}
 </section>
 <section class="card"><div class="cardhead"><h2>Recent platform events</h2><span class="muted small">Illustrative feed</span></div><div class="activity">
  <div class="activityitem"><div class="activityicon">✓</div><div><b>Preview health check passed</b><p>GET /api/health · HTTP 200 · previously verified</p></div></div>
  <div class="activityitem"><div class="activityicon">!</div><div><b>Database connection validation blocked</b><p>Username mismatch · no database query executed</p></div></div>
  <div class="activityitem"><div class="activityicon">◇</div><div><b>Governance controls retained</b><p>Production, launch and financial execution remain OFF</p></div></div>
 </div></section>
</div>`},
vision:{title:"CEDARS Empire · Original vision",sub:"The complete destination: a 24/7 AI Grid Economy evolving into the CEDARS HUMANITY GRID™.",html:`<div class="notice"><strong>Original operating ambition</strong>DEPLOY → CONNECT → VERIFY → EARN → REINVEST. AI coordinates useful work; real buyers and providers create commercial value through verified delivery. The 250,000 million AI IQ ambition is strategic—not a measured or deployed AI count.</div>
<div class="card"><div class="cardhead"><h2>The four connected economic layers</h2><span class="pill blue">FOUNDATION</span></div><div class="grid layout2">
<div class="module"><h3>☁ CLOUD</h3><p>Compute and AI APIs · data processing · SaaS and business software · cybersecurity and automation</p></div>
<div class="module"><h3>🌍 EARTH & SURFACE</h3><p>Solar and energy services · agriculture and water · buildings and shelter · cleaning, delivery and mobility</p></div>
<div class="module"><h3>⛏ UNDERGROUND</h3><p>Mining and minerals · geospatial and geology data · utilities and infrastructure · equipment and maintenance</p></div>
<div class="module"><h3>♧ HUMAN BUSINESS</h3><p>Trade and procurement · professional services · education and training · care, tourism and logistics</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Seven revenue-capable engine categories</h2><span class="pill blue">COMMERCIAL SCOPE</span></div><div class="grid layout2">
<div class="module"><h3>AI & CLOUD</h3><p>Document processing, data labeling, translation, workflow automation, API and SaaS access</p><span class="tag">Per task · seat · API</span></div>
<div class="module"><h3>ENERGY</h3><p>Solar services, energy monitoring, charging and verified energy services</p><span class="tag">Per kWh · contract</span></div>
<div class="module"><h3>FOOD, WATER & LAND</h3><p>Farm services, irrigation, water delivery and produce aggregation</p><span class="tag">Per order · volume</span></div>
<div class="module"><h3>MOBILITY & LOGISTICS</h3><p>Delivery, shared transport, routing, fleet use and warehousing</p><span class="tag">Per trip · shipment</span></div>
<div class="module"><h3>BUILDINGS & SERVICES</h3><p>Cleaning, repairs, shelter booking, laundry and maintenance</p><span class="tag">Per job · night</span></div>
<div class="module"><h3>UNDERGROUND & INDUSTRY</h3><p>Geospatial data, equipment maintenance and mineral-sector analytics</p><span class="tag">Project · license</span></div>
<div class="module"><h3>HUMAN PROFESSIONAL SERVICES</h3><p>Training, design, research, procurement and customer support</p><span class="tag">Hour · milestone</span></div>
</div><p class="muted small" style="margin-top:12px">Launch a commercial service only when there is a validated buyer, provider capacity, lawful delivery, evidence and positive contribution margin. Commercial settlement remains outside CEDARS transaction infrastructure under the current NO FIAT TRANSACTIONS constraint.</p></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>CEDARS HUMANITY GRID™ · ten layers</h2><span class="pill blue">FULL STRATEGIC ARCHITECTURE</span></div><div class="grid layout2">
<div class="healthrow"><b>01 · AI Grid Economy</b><span class="tag">FOUNDATION</span></div><div class="healthrow"><b>02 · Trust & Verification</b><span class="tag">TRUST</span></div>
<div class="healthrow"><b>03 · Proof of Contribution</b><span class="tag">CONTRIBUTION</span></div><div class="healthrow"><b>04 · Collective Memory</b><span class="tag">KNOWLEDGE</span></div>
<div class="healthrow"><b>05 · AI Discovery Engine</b><span class="tag">DISCOVERY</span></div><div class="healthrow"><b>06 · Innovation Network</b><span class="tag">INNOVATION</span></div>
<div class="healthrow"><b>07 · AI Twins™</b><span class="tag">HUMAN-AI</span></div><div class="healthrow"><b>08 · Innovation Dome™</b><span class="tag">INVENTION</span></div>
<div class="healthrow"><b>09 · Synthetic Reality™</b><span class="tag">EXPERIENCE</span></div><div class="healthrow"><b>10 · Human Progress Index</b><span class="tag">IMPACT</span></div>
</div><div class="notice blue" style="margin-top:12px"><strong>Cross-cutting capability · Collective Intelligence</strong>Connect people, AI agents, organizations, sensors and knowledge systems so human judgment, machine pattern-finding, local knowledge and shared memory work together.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Four connected human-progress networks</h2></div><div class="grid layout2">
<div class="module"><h3>Internet of Services</h3><p>Discover · match · deliver useful services across cloud, Earth, underground and human business.</p></div>
<div class="module"><h3>Internet of Contribution</h3><p>Verify · attribute · recognize meaningful work and measurable contribution.</p></div>
<div class="module"><h3>Internet of Knowledge</h3><p>Preserve · connect · learn from research, reports, lessons, failures and verified solutions.</p></div>
<div class="module"><h3>Internet of Innovation</h3><p>Invent · simulate · test · verify · deploy new solutions.</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>AI, compute, robotics and connected endpoints</h2></div><div class="grid layout3">
<div class="module"><h3>AI agents & models</h3><p>Task-specific reasoning, extraction, translation, coding, forecasting and support.</p></div>
<div class="module"><h3>Tools & compute</h3><p>Cloud APIs, open models, GPUs / CPUs, queues, caches and scheduled workers.</p></div>
<div class="module"><h3>Connected endpoints</h3><p>Business systems, meters, sensors, marketplaces, people, devices and provider APIs.</p></div>
<div class="module"><h3>Robotics + AI</h3><p>Sense · plan · act · report evidence, with authorized people and devices in the loop.</p></div>
<div class="module"><h3>Collective Memory workflow</h3><p>Capture · structure · connect · reuse. Preserve knowledge assets, lessons and verified solutions.</p></div>
<div class="module"><h3>Innovation Dome™ workspace</h3><p>Memory wall · expert wall · innovation graph · future simulator · contribution ledger.</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Contribution, impact and human safeguards</h2></div><div class="grid layout2">
<div class="module"><h3>Contribution Value concept</h3><p>Impact × Reach × Trust × Sustainability. Signals may include originality, usefulness, adoption, verified outcomes and collaboration.</p></div>
<div class="module"><h3>Human Progress Index</h3><p>Knowledge created · problems solved · innovations deployed · lives and outcomes improved · solutions preserved.</p></div>
<div class="module"><h3>AI Twins™ safeguards</h3><p>Disclosed AI · human agency · consent before consequential actions · visible, editable, exportable and deletable memory.</p></div>
<div class="module"><h3>Trust, ownership and fairness</h3><p>Evidence and appeals · attribution and proof of origin · privacy and data minimization · independent oversight and anti-gaming controls.</p></div>
</div><p class="muted small" style="margin-top:12px">Green and environmental opportunities are represented across the source-defined Energy, Food, Water & Land, Earth & Surface, and Underground & Industry scopes; no additional standalone engine is invented here.</p></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Command Centre · evidence-linked measures</h2></div><div class="grid layout3">
<div class="module"><h3>Verified service activity</h3><p>Accepted jobs, billable work evidence and customer acceptance.</p></div>
<div class="module"><h3>Grid utilization</h3><p>Capacity available versus capacity used, by engine and provider.</p></div>
<div class="module"><h3>Unit economics</h3><p>Cost per job, direct service costs and contribution margin from approved external records.</p></div>
<div class="module"><h3>Knowledge & innovation</h3><p>Knowledge preserved, tested solutions and innovations deployed.</p></div>
<div class="module"><h3>Human progress</h3><p>Evidence-backed outcomes and cross-sector collaboration.</p></div>
<div class="module"><h3>Exceptions & incidents</h3><p>Delayed or failed jobs, quality exceptions, safety events and recovery status.</p></div>
</div><p class="muted small" style="margin-top:12px">Every displayed metric must link to its evidence, source system, timestamp and auditable record. This prototype contains no live operational measurements.</p></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Shared platform control plane</h2></div><div class="grid layout3">
<div class="module"><h3>Identity & trust</h3><p>Identity, KYC where lawful and required, permissions, privacy and access controls</p></div>
<div class="module"><h3>Commercial coordination</h3><p>Demand, contracts, service definitions, pricing and provider eligibility</p></div>
<div class="module"><h3>AI orchestration</h3><p>Classify, route, monitor and coordinate agents, tools, people and devices</p></div>
<div class="module"><h3>Evidence & ledger</h3><p>Delivery proof, event records, unique references, audit and attribution</p></div>
<div class="module"><h3>Safety & governance</h3><p>Approvals, fraud controls, incident response, rate limits and emergency kill switch</p></div>
<div class="module"><h3>Observability</h3><p>Analytics, uptime, latency, cost per job, quality, error rate and gross margin</p></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>24/7 operating cycle</h2></div><div class="grid layout3">
<div class="module"><h3>00 · LISTEN</h3><p>Orders, needs, telemetry, schedules and provider availability</p></div><div class="module"><h3>01 · DISCOVER</h3><p>Needs, buyers, suppliers, capacity and opportunities</p></div><div class="module"><h3>02 · MATCH</h3><p>Eligibility, price, geography and contract terms</p></div>
<div class="module"><h3>03 · EXECUTE</h3><p>Authorized AI tasks, people, providers, devices and robotics</p></div><div class="module"><h3>04 · VERIFY</h3><p>Quality, delivery evidence and customer acceptance</p></div><div class="module"><h3>05 · BILL & RECORD</h3><p>Itemized commercial records and auditable obligations</p></div>
<div class="module"><h3>06 · RECONCILE EXTERNALLY</h3><p>Any commercial settlement occurs outside CEDARS transaction infrastructure</p></div><div class="module"><h3>07 · LEARN</h3><p>Reliability, feedback, unit economics, incidents and impact</p></div>
</div><p class="muted small" style="margin-top:12px">24/7 does not mean unsupervised. Human review, permissions, alerts, incident response and a kill switch remain essential.</p></div>
<div class="notice red" style="margin-top:15px"><strong>Non-negotiable governance</strong>NO FIAT TRANSACTIONS inside CEDARS OS™. No fiat deposits, payment intake, withdrawals, payouts or settlement rails. Internal credits are not cash or revenue. Production FROZEN · Financial execution OFF · Public launch OFF. No capability becomes LIVE without evidence and approval.</div>`},
grids:{title:"Grid engine register",sub:"Original engine scope, revenue categories and existing module catalogue—kept distinct from runtime readiness.",html:`<div class="notice blue"><strong>Architecture register · not a live-service count</strong>This register preserves the original engine scope. VISION entries are strategic architecture; catalogue entries are present in the prototype. Neither label proves a connected or operational service. Local controls do not activate infrastructure.</div><div class="grid modulegrid" id="gridCards"></div>`},
modules:{title:"Module control center",sub:"Central governance for platform modules, feature availability and release eligibility.",html:`<div class="notice"><strong>Safe-state controls</strong>These prototype controls change local display state only. They do not change backend feature flags or activate real services.</div><div class="grid modulegrid" id="moduleCards"></div>`},
workers:{title:"AI worker control",sub:"Worker catalogue, assignment policy, approvals and runtime readiness.",html:`<div class="notice red"><strong>Autonomous execution is not connected</strong>Worker entries are catalogue demonstrations. No agent will execute jobs, contact users, or perform external actions from this prototype.</div><div class="grid modulegrid" id="workerCards"></div>`},
tasks:{title:"Grid task workflow",sub:"Human-operated work intake with review, ownership and audit visibility.",html:`<div class="grid layout2"><section class="card"><div class="cardhead"><h2>Create a Preview task</h2><span class="pill blue">LOCAL DEMO</span></div><label class="small muted">Task title</label><input id="taskTitle" placeholder="Describe the work" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px"><label class="small muted">Grid</label><select id="taskGrid" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px"><option>Ledger Grid</option><option>AI IQ Grid</option><option>Education AI</option><option>Sales AI</option></select><button class="btn primary" id="addTask">Add task to demo queue</button></section><section class="card"><div class="cardhead"><h2>Workflow safeguards</h2></div><p class="muted small">Human review required · execution gated · task audit retained · no payment or financial action.</p><span class="pill green">HUMAN-OPERATED WORKFLOW</span></section></div><section class="card" style="margin-top:15px"><div class="cardhead"><h2>Task queue</h2><span class="muted small">Local browser demonstration</span></div><div id="taskList" class="empty">No demo tasks created yet.</div></section>`},
wallet:{title:"Wallet Grid",sub:"Non-fiat wallet identity and permitted ledger-reference interface.",html:`<div class="notice red"><strong>Non-fiat architecture</strong>No deposits, withdrawals, payment rails, cash balances or fiat settlement. Any example balance is illustrative only and is not a claim on funds.</div><div class="grid stats"><div class="card"><div class="statlabel">Wallet service</div><div class="statvalue">OFF</div><div class="statnote">Integration not connected</div></div><div class="card"><div class="statlabel">Wallet identities</div><div class="statvalue">—</div><div class="statnote">No live Preview records</div></div><div class="card"><div class="statlabel">Transactions</div><div class="statvalue">0</div><div class="statnote">No financial execution</div></div><div class="card"><div class="statlabel">Fiat support</div><div class="statvalue">NO</div><div class="statnote">Architecturally prohibited</div></div></div><div class="card"><h2>Wallet capability boundaries</h2><div class="healthrow">Identity and ownership references <span class="pill blue">DESIGN SCOPE</span></div><div class="healthrow">Non-fiat contribution records <span class="pill blue">DESIGN SCOPE</span></div><div class="healthrow">Cash deposit / withdrawal <span class="pill red">PROHIBITED</span></div><div class="healthrow">Payment and settlement rails <span class="pill red">PROHIBITED</span></div></div>`},
ledger:{title:"Ledger Grid",sub:"Auditable records and event history without fiat transaction assumptions.",html:`<div class="notice blue"><strong>Ledger integrity</strong>The ledger is a recordkeeping capability. It must not imply cash custody, redeemable balances or payment settlement.</div><div class="grid layout2"><div class="card"><h2>Ledger service status</h2><div class="statvalue">NOT CONNECTED</div><p class="muted small">Preview database connection and schema acceptance are prerequisites.</p></div><div class="card"><h2>Required controls</h2><div class="healthrow">Append-only event history <span class="pill blue">REQUIRED</span></div><div class="healthrow">Actor and timestamp attribution <span class="pill blue">REQUIRED</span></div><div class="healthrow">Correction / reversal traceability <span class="pill blue">REQUIRED</span></div></div></div>`},
money:{title:"Money Grid",sub:"Non-fiat value, contribution and accounting concepts under strict architectural boundaries.",html:`<div class="notice red"><strong>Financial execution disabled · Fiat prohibited</strong>This area is a governance and conceptual workspace only. It does not initiate, simulate as real, or process money transfers.</div><div class="grid layout3"><div class="card"><h2>Contribution records</h2><p class="muted small">Track approved non-fiat contributions and their evidence.</p><span class="pill blue">DESIGN SCOPE</span></div><div class="card"><h2>Value attribution</h2><p class="muted small">Record non-cash attribution with transparent methodology.</p><span class="pill blue">DESIGN SCOPE</span></div><div class="card"><h2>Settlement</h2><p class="muted small">Conventional payment and fiat settlement are excluded.</p><span class="pill red">DISABLED</span></div></div>`},
integrations:{title:"Integration hub",sub:"Service connectivity, contracts, events and integration health.",html:`<div class="notice"><strong>Integration readiness</strong>Catalogue entries are not evidence of connected services. Each integration requires a successful Preview test and an owner.</div><div class="card tablewrap"><table><thead><tr><th>Integration</th><th>Pattern</th><th>Current state</th><th>Next evidence</th></tr></thead><tbody>${[["Preview PostgreSQL","Shared data","Blocked","Successful read-only connection"],["Identity provider","Core service","Not verified","Login and session tests"],["Grid APIs","Service boundary","Not connected","Contract and integration tests"],["Event bus","Event-driven","Not connected","Publish / consume test"],["AI runtime","Worker execution","Not implemented","Sandboxed execution test"],["External chain observation","Read-only adapter","Not verified","Confirmed observation evidence"]].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="pill amber">${x[2]}</span></td><td>${x[3]}</td></tr>`).join("")}</tbody></table></div>`},
analytics:{title:"Analytics & observability",sub:"System health, operational telemetry and evidence quality.",html:`<div class="notice blue"><strong>Data provenance is visible</strong>Prototype values are illustrative. Production-quality analytics require connected Preview data, timestamps and source attribution.</div><div class="grid stats"><div class="card"><div class="statlabel">API uptime</div><div class="statvalue">—</div><div class="statnote">No live monitoring feed</div></div><div class="card"><div class="statlabel">Error rate</div><div class="statvalue">—</div><div class="statnote">Not measured here</div></div><div class="card"><div class="statlabel">Queue depth</div><div class="statvalue">—</div><div class="statnote">Worker runtime disconnected</div></div><div class="card"><div class="statlabel">Data freshness</div><div class="statvalue">—</div><div class="statnote">No live Preview data feed</div></div></div><div class="card"><h2>Observability domains</h2><div class="healthrow">Application logs <span class="pill amber">VERIFY</span></div><div class="healthrow">Audit events <span class="pill amber">VERIFY</span></div><div class="healthrow">Database metrics <span class="pill amber">BLOCKED</span></div><div class="healthrow">Worker telemetry <span class="pill amber">NOT CONNECTED</span></div></div>`},
users:{title:"Users & roles",sub:"Identity, role assignment and least-privilege access governance.",html:`<div class="notice blue"><strong>Identity data is not connected</strong>Sample roles below illustrate the intended access model and are not actual user accounts.</div><div class="card tablewrap"><table><thead><tr><th>Role</th><th>Scope</th><th>Authority</th><th>Status</th></tr></thead><tbody>${[["Founder","Platform-wide","Governance oversight","Policy-defined"],["Super Admin","Platform operations","Configuration subject to approval","Policy-defined"],["Technical Lead","Engineering","Preview deployment and diagnostics","Policy-defined"],["Compliance Officer","Audit and compliance","Review and evidence approval","Policy-defined"],["Grid Operator","Assigned Grid","Human-operated tasks","Policy-defined"],["Viewer","Read-only","No configuration changes","Policy-defined"]].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill blue">${x[3]}</span></td></tr>`).join("")}</tbody></table></div>`},
approvals:{title:"Approval center",sub:"Independent review for sensitive configuration and release decisions.",html:`<div class="notice"><strong>Two-person governance</strong>Consequential changes should require a reason, an authorized requester and independent approval. No approval action here changes a real system.</div><div class="card"><div class="cardhead"><h2>Approval queue</h2><span class="pill green">NO PENDING DEMO REQUESTS</span></div><div class="empty">Approval requests will appear here when the Preview governance API is connected.</div></div>`},
audit:{title:"Audit trail",sub:"Who changed what, when, why and under which authorization.",html:`<div class="notice blue"><strong>Audit evidence</strong>Events displayed in this prototype are examples of the intended audit interface, not fetched records.</div><div class="card tablewrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Target</th><th>Evidence</th></tr></thead><tbody><tr><td>—</td><td>System</td><td>Preview health check</td><td>API</td><td><span class="pill green">HTTP 200 VERIFIED</span></td></tr><tr><td>—</td><td>GitHub Actions</td><td>Database username validation failed</td><td>Preview DB</td><td><span class="pill amber">RUN LOG</span></td></tr><tr><td>—</td><td>Governance</td><td>Production freeze retained</td><td>Release controls</td><td><span class="pill blue">POLICY</span></td></tr></tbody></table></div>`},
security:{title:"Security & governance",sub:"Release controls, environment boundaries and security assurance.",html:`<div class="grid layout2"><div class="card"><h2>Environment safeguards</h2><div class="healthrow">Preview environment <span class="pill green">ACTIVE</span></div><div class="healthrow">Production <span class="pill red">FROZEN</span></div><div class="healthrow">Public launch <span class="pill red">OFF</span></div><div class="healthrow">Financial execution <span class="pill red">OFF</span></div><div class="healthrow">Fiat transactions <span class="pill red">PROHIBITED</span></div></div><div class="card"><h2>Security acceptance</h2><div class="healthrow">Authentication / authorization <span class="pill amber">NOT ACCEPTED</span></div><div class="healthrow">Secrets management <span class="pill amber">VERIFY</span></div><div class="healthrow">Audit integrity <span class="pill amber">VERIFY</span></div><div class="healthrow">Recovery testing <span class="pill amber">NOT TESTED</span></div><div class="healthrow">Threat review <span class="pill amber">PENDING</span></div></div></div>`},
settings:{title:"Platform settings",sub:"Architecture policy, environment metadata and interface preferences.",html:`<div class="grid layout2"><div class="card"><h2>Architecture profile</h2><div class="healthrow">Architecture <b>Hybrid modular platform</b></div><div class="healthrow">Initial deployment model <b>Modular monolith</b></div><div class="healthrow">Service evolution <b>Selective extraction</b></div><div class="healthrow">Communication <b>API + governed events</b></div><div class="healthrow">Control plane <b>Centralized</b></div></div><div class="card"><h2>Non-negotiable policies</h2><div class="healthrow">NO FIAT TRANSACTIONS <span class="pill red">ENFORCED BY POLICY</span></div><div class="healthrow">Evidence before LIVE <span class="pill green">REQUIRED</span></div><div class="healthrow">Production freeze <span class="pill red">ACTIVE</span></div><div class="healthrow">Preview-only development <span class="pill green">ACTIVE</span></div></div></div>`}
};
const gridData=[["AI & Cloud","Document processing, data labeling, translation, workflow automation, API and SaaS","VISION","Buyer + delivered service required","Revenue engine"],["Energy","Solar, energy monitoring, charging and verified energy services","VISION","Provider + delivery evidence required","Revenue engine"],["Food, Water & Land","Farm services, irrigation, water delivery and produce aggregation","VISION","Buyer + provider capacity required","Revenue engine"],["Mobility & Logistics","Delivery, transport, routing, fleet use and warehousing","VISION","Order + proof of delivery required","Revenue engine"],["Buildings & Services","Cleaning, repairs, shelter booking, laundry and maintenance","VISION","Service acceptance required","Revenue engine"],["Underground & Industry","Geospatial data, equipment maintenance and mineral-sector analytics","VISION","Licensing + safety evidence required","Revenue engine"],["Human Professional Services","Training, design, research, procurement and customer support","VISION","Qualified provider + accepted work","Revenue engine"],["Wallet Grid","Identity and non-fiat wallet references","STANDBY","Not connected","Prototype catalogue"],["Ledger Grid","Auditable event and record history","STANDBY","DB pending","Prototype catalogue"],["Money Grid","Non-fiat contribution and value records","OFF","Execution disabled","Prototype catalogue"],["AI IQ Grid","Intelligence and reasoning services","STANDBY","Not connected","Prototype catalogue"],["Sales AI","Sales support and workflow assistance","OFF","Not connected","Prototype catalogue"],["Support AI","Human-supervised support workflows","OFF","Not connected","Prototype catalogue"],["Healthcare AI","Healthcare information workflows","OFF","Not connected","Prototype catalogue"],["Education AI","Education and learning workflows","OFF","Not connected","Prototype catalogue"],["Contribution Grid","Contribution tracking and attribution","STANDBY","Not connected","Prototype catalogue"],["Collective Memory","Governed knowledge and memory","OFF","Not connected","Prototype catalogue"],["Innovation Grid","Innovation lifecycle management","OFF","Not connected","Prototype catalogue"],["Simulation Grid","Scenario modelling and simulation","OFF","Not connected","Prototype catalogue"],["Civilization Ledger","Humanity Grid knowledge and contribution record architecture","VISION","Not verified as a connected service","Humanity Grid scope"],["AI Discovery Engine","Cross-link ideas, retrieve prior solutions and identify experiments","VISION","Not connected","Humanity Grid scope"],["Innovation Network","Connect experts, organizations, knowledge and inventions","VISION","Not connected","Humanity Grid scope"],["AI Twins™","User-authorized digital knowledge and collaboration companions","VISION","Consent and permission design required","Humanity Grid scope"],["Innovation Dome™","Collaborative research, invention and simulation environment","VISION","Not connected","Humanity Grid scope"],["Synthetic Reality™","Persistent immersive collaboration and simulation environment","VISION","Not connected","Humanity Grid scope"],["Human Progress Index","Evidence-based measurement of knowledge, solutions and impact","VISION","Metrics and evidence model required","Humanity Grid scope"],["Trust & Verification","Identity, evidence, permissions, appeals and accountability","VISION","Control-plane requirements","Humanity Grid scope"],["Proof of Contribution","Evidence-linked attribution of meaningful contributions","VISION","Transparent criteria and appeals required","Humanity Grid scope"],["Collective Intelligence","Shared problem-solving across people, agents, organizations and sensors","VISION","Not connected","Cross-cutting capability"]];
const moduleData=[["Authentication","Identity and session services","ON"],["Permissions","Role and policy enforcement","ON"],["Feature Flags","Module lifecycle control","ON"],["Audit","Security and activity records","ON"],["Notifications","Platform messaging","STANDBY"],["Logging","Application diagnostics","STANDBY"],["Settings","Platform configuration","ON"]];
const workerData=[["Research Worker","Evidence gathering and synthesis"],["Task Coordinator","Human task routing"],["Audit Assistant","Audit preparation"],["Support Assistant","Draft support responses"],["Education Assistant","Learning assistance"],["Analytics Worker","Report preparation"],["Integration Monitor","Connectivity checks"],["Compliance Assistant","Policy review support"]];
let taskRows=[];
function statusPill(s){return '<span class="pill '+(s==="ON"?"green":s==="OFF"?"red":"amber")+'">'+s+'</span>'}
function renderCards(id,data,type){document.getElementById(id).innerHTML=data.map((x,i)=>`<article class="module"><div class="moduletop"><div><h3>${x[0]}</h3><p>${x[1]}</p></div>${type==="grid"?statusPill(x[2]):type==="module"?statusPill(x[2]):'<span class="pill amber">CATALOGUED</span>'}</div>${type==="grid"?'<div class="small muted" style="margin:0 0 6px">Evidence / dependency: '+x[3]+'</div><div class="small muted" style="margin:0 0 10px">Classification: '+(x[4]||"Existing prototype catalogue")+'</div><div class="small muted">Lifecycle controls are illustrative only; no service is activated here.</div>':type==="module"?'<div class="seg" data-index="'+i+'" data-type="module"><button data-state="ON" '+(x[2]==="ON"?'class="selected"':'')+'>ON</button><button data-state="STANDBY" '+(x[2]==="STANDBY"?'class="selected"':'')+'>STANDBY</button><button data-state="OFF">OFF</button></div>':'<div class="metricline"><span class="muted small">Runtime</span><b class="pill red">NOT CONNECTED</b></div><button class="btn" disabled>Execution unavailable</button>'}</article>`).join("")}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function openPage(page){const p=pages[page]||pages.overview;document.getElementById("crumb").textContent=p.title;document.querySelectorAll("#nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML='<div class="pagehead"><div><div class="eyebrow">CEDARS OS™ · COMMAND CENTER</div><h1>'+p.title+'</h1><p>'+p.sub+'</p></div><div class="actions"><button class="btn" id="helpBtn">ⓘ About this view</button><button class="btn primary" id="refreshBtn">↻ Refresh view</button></div></div>'+p.html+'<div class="footer-note">CEDARS OS™ · Hybrid Modular Enterprise Architecture · Preview prototype only · Not a live operational console</div>';if(page==="grids")renderCards("gridCards",gridData,"grid");if(page==="modules")renderCards("moduleCards",moduleData,"module");if(page==="workers")renderCards("workerCards",workerData,"worker");if(page==="tasks")renderTasks();document.getElementById("refreshBtn").onclick=()=>showToast("Prototype view refreshed. No external data was requested.");document.getElementById("helpBtn").onclick=()=>showToast("Demonstration interface. Backend connections are not implied.");}
function renderTasks(){const el=document.getElementById("taskList");el.className=taskRows.length?"":"empty";el.innerHTML=taskRows.length?'<div class="tablewrap"><table><thead><tr><th>Task</th><th>Grid</th><th>Status</th><th>Execution</th></tr></thead><tbody>'+taskRows.map(t=>'<tr><td>'+t.title+'</td><td>'+t.grid+'</td><td><span class="pill amber">PENDING REVIEW</span></td><td><span class="pill red">NOT EXECUTED</span></td></tr>').join("")+'</tbody></table></div>':"No demo tasks created yet."}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)openPage(b.dataset.page)});
document.getElementById("content").addEventListener("click",e=>{const state=e.target.closest("[data-state]");if(state){const group=state.closest(".seg");group.querySelectorAll("button").forEach(b=>b.classList.toggle("selected",b===state));showToast("Local prototype state updated. No backend setting changed.");}if(e.target.id==="addTask"){const title=document.getElementById("taskTitle").value.trim();if(!title){showToast("Enter a task title first.");return}taskRows.unshift({title,grid:document.getElementById("taskGrid").value});renderTasks();document.getElementById("taskTitle").value="";showToast("Demo task added. No worker execution started.");}});
openPage("overview");
</script>
</body></html>
