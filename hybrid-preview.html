reliability:{title:"Reliability & Resilience",sub:"CEDARS-RELIABILITY-001 · A cross-platform assurance framework and verification register.",html:`
<div class="notice blue"><strong>Preservation rule · additive update only</strong>This framework supplements the existing prototype. It does not remove or replace existing grids, modules, workers, customer flows or vision layers. All controls shown here are illustrative until connected to verified services. The 20× ambition is a target for measurable comparison—not a current performance claim.</div>
<div class="grid stats">
 <div class="card"><div class="statlabel">Critical reliability domains</div><div class="statvalue">10</div><div class="statnote">Proposed assurance domains</div></div>
 <div class="card"><div class="statlabel">Target critical availability</div><div class="statvalue">99.99%</div><div class="statnote">Proposed SLO · not measured</div></div>
 <div class="card"><div class="statlabel">Production release gates</div><div class="statvalue">100%</div><div class="statnote">Must pass with evidence before LIVE</div></div>
 <div class="card"><div class="statlabel">Current assurance status</div><div class="statvalue" style="font-size:20px">NOT VERIFIED</div><div class="statnote">No reliability certification implied</div></div>
</div>
<div class="card"><div class="cardhead"><h2>Ten reliability and resilience domains</h2><span class="pill blue">REQUIREMENTS</span></div>
<div class="grid layout2">
 <div class="module"><h3>01 · No single point of failure</h3><p>Identify critical dependencies; design tested redundancy, failover and isolation for compute, network, identity and data.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>02 · Zero-trust security</h3><p>Strong identity, least privilege, service-to-service authorization, short-lived credentials, secrets rotation and continuous access checks.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>03 · Backup and recovery</h3><p>Encrypted independent backups, defined retention, recovery-point and recovery-time objectives, and recurring restore drills.</p><span class="pill amber">RESTORE TEST REQUIRED</span></div>
 <div class="module"><h3>04 · Data integrity and audit</h3><p>Append-only audit evidence, integrity checks, provenance, versioning, idempotency and traceable corrections.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>05 · AI worker safety</h3><p>Scoped tools, permission boundaries, budget limits, output validation, prompt-injection defenses, human escalation and kill switch.</p><span class="pill amber">RUNTIME NOT CONNECTED</span></div>
 <div class="module"><h3>06 · Graceful failure</h3><p>Timeouts, bounded retries, circuit breakers, dead-letter queues, duplicate prevention and safe degraded modes.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>07 · Independent governance</h3><p>Separation of duties, no self-approval for high-risk actions, reason capture, quorum and immutable approval evidence.</p><span class="pill amber">POLICY / VERIFY</span></div>
 <div class="module"><h3>08 · Continuous testing</h3><p>Automated regression, security tests, dependency scans, penetration testing, load testing and controlled failure simulation.</p><span class="pill amber">TEST EVIDENCE REQUIRED</span></div>
 <div class="module"><h3>09 · Privacy and identity recovery</h3><p>Data minimization, encryption, consent, secure account recovery, access review, export and deletion workflows.</p><span class="pill amber">DESIGN / VERIFY</span></div>
 <div class="module"><h3>10 · Operational intelligence</h3><p>Service-level indicators, distributed traces, logs, alerting, incident ownership, status communication and post-incident learning.</p><span class="pill amber">OBSERVABILITY GAP</span></div>
</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Reliability verification coverage</h2><span class="pill amber">OPEN REGISTER</span></div>
<p class="muted small">These are verification categories to complete across the three agreed workstreams. “Not verified” means evidence is still required; it does not mean a feature is absent.</p>
<div class="tablewrap"><table><thead><tr><th>Workstream</th><th>Coverage required</th><th>Evidence required</th><th>Status</th></tr></thead><tbody>
<tr><td><b>Customer Portal</b></td><td>Identity, session security, account recovery, privacy, API authorization, service continuity, support escalation</td><td>Authenticated end-to-end tests, access-denial tests, recovery drills, privacy checks</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>Admin</b></td><td>RBAC, separation of duties, approvals, audit integrity, secrets, configuration safety, emergency disable</td><td>Role matrix tests, unauthorized-action denials, approval evidence, audit integrity checks</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>Command Centre</b></td><td>Health/readiness, observability, dependency map, failover, backup restoration, incident response, SLOs</td><td>Runtime probes, restore reports, controlled failure drills, alert and recovery records</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
<tr><td><b>AI workers & Grids</b></td><td>Worker identity, scoped tools, budgets, task idempotency, output validation, human override</td><td>Controlled task runs, adversarial tests, cost records, execution traces and kill-switch test</td><td><span class="pill amber">RUNTIME NOT CONNECTED</span></td></tr>
<tr><td><b>Shared infrastructure</b></td><td>Database, network, provider APIs, deployment, backups, encryption and recovery dependencies</td><td>Dependency inventory, security review, resilience and restoration test results</td><td><span class="pill amber">NOT VERIFIED</span></td></tr>
</tbody></table></div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>Proposed service-level objectives</h2><span class="pill blue">TARGETS ONLY</span></div><div class="tablewrap"><table><thead><tr><th>Measure</th><th>Proposed target</th><th>How it is proven</th></tr></thead><tbody>
<tr><td>Critical service availability</td><td>99.99%</td><td>Monthly SLI from independent monitoring, excluding only documented maintenance under an approved policy</td></tr>
<tr><td>Critical data integrity</td><td>Zero acknowledged records lost</td><td>Reconciliation, integrity checks and recovery-point evidence</td></tr>
<tr><td>Critical service recovery</td><td>Within 5 minutes where architecture permits</td><td>Timed failover drills; publish actual results and scope</td></tr>
<tr><td>Privileged unauthorized actions</td><td>Zero accepted</td><td>Negative authorization tests and audit review</td></tr>
<tr><td>Untraceable privileged changes</td><td>Zero</td><td>Independent audit completeness checks</td></tr>
<tr><td>Duplicate approved task execution</td><td>Zero unintended duplicates</td><td>Idempotency and replay tests</td></tr>
<tr><td>Critical backup restore tests</td><td>100% pass</td><td>Scheduled restore drills with signed evidence</td></tr>
<tr><td>Critical release gates</td><td>100% pass before LIVE</td><td>Evidence-linked release acceptance; fail closed</td></tr>
</tbody></table></div><div class="notice">Targets are proposed engineering objectives, not claims about current CEDARS performance. Availability and recovery targets must be validated against architecture, cost and actual operating requirements.</div></div>
<div class="card" style="margin-top:15px"><div class="cardhead"><h2>20× reliability measurement protocol</h2><span class="pill amber">NOT YET SCORED</span></div><p>Do not assign a 20× score using arbitrary weights. Define comparable measures, a fixed observation window, independent data sources and a baseline. For each measure, calculate the improvement using the same definition and scope. For failure rates, compare the reduction in rate; for availability, compare downtime or failed-request rates. Publish confidence, exclusions and test conditions.</p><div class="healthrow"><b>Bitcoin comparison</b><span class="pill blue">PROTOCOL / NETWORK SCOPE ONLY</span></div><div class="healthrow"><b>CEDARS comparison</b><span class="pill amber">BASELINE NOT ESTABLISHED</span></div><div class="healthrow"><b>Independent validation</b><span class="pill amber">REQUIRED</span></div></div>
<div class="notice red" style="margin-top:15px"><strong>Governance boundaries remain unchanged</strong>Preview-only development. Production FROZEN. Public launch OFF. Financial execution OFF. NO FIAT TRANSACTIONS. This page does not activate infrastructure, change live settings or authorize deployment to Production.</div>`},
settings:{title:"Platform settings",sub:"Architecture policy, environment metadata and interface preferences.",html:`<div class="grid layout2"><div class="card"><h2>Architecture profile</h2><div class="healthrow">Architecture <b>Hybrid modular platform</b></div><div class="healthrow">Initial deployment model <b>Modular monolith</b></div><div class="healthrow">Service evolution <b>Selective extraction</b></div><div class="healthrow">Communication <b>API + governed events</b></div><div class="healthrow">Control plane <b>Centralized</b></div></div><div class="card"><h2>Non-negotiable policies</h2><div class="healthrow">NO FIAT TRANSACTIONS <span class="pill red">ENFORCED BY POLICY</span></div><div class="healthrow">Evidence before LIVE <span class="pill green">REQUIRED</span></div><div class="healthrow">Production freeze <span class="pill red">ACTIVE</span></div><div class="healthrow">Preview-only development <span class="pill green">ACTIVE</span></div></div></div>`}
};

const moduleData=[["Authentication","Identity and session services","ON"],["Permissions","Role and policy enforcement","ON"],["Feature Flags","Module lifecycle control","ON"],["Audit","Security and activity records","ON"],["Notifications","Platform messaging","STANDBY"],["Logging","Application diagnostics","STANDBY"],["Settings","Platform configuration","ON"],["External Invoice Reference","Store an externally issued invoice identifier and status reference only; CEDARS does not issue invoices, collect payments or move funds","OFF"],["AI & Robotics Safety Oversight","Human authorization, operating boundaries, telemetry review, safe-state checks and emergency stop governance for connected devices or robots","STANDBY"],["Demand & Supplier Matching","Discover buyer needs, verified suppliers, available capacity, eligibility and geographic fit","STANDBY"],["Contracts & Commercial Terms","Record approved scopes, contract terms, responsibilities, service levels and acceptance criteria","STANDBY"],["Pricing & Quotations","Prepare transparent quotes, pricing rules and cost assumptions; no payment processing","STANDBY"],["Delivery Evidence & Acceptance","Capture deliverables, service evidence, quality checks, customer acceptance and exceptions","STANDBY"],["External Settlement Reference","Record an external commercial settlement reference or reconciliation status only; no funds, payment rails, balances or payouts","OFF"],["Fraud & Risk Controls","Flag duplicate, inconsistent or suspicious activity for authorized human review","STANDBY"],["Privacy & Data Governance","Consent, data minimization, retention, export, deletion and access governance","STANDBY"],["Backup & Recovery","Backup verification, restore testing, recovery objectives and artifact integrity","STANDBY"],["Incident & Kill-Switch Control","Incident escalation, scoped service isolation, operator alerts and controlled shutdown","STANDBY"]];
const workerData=[["Research Worker","Evidence gathering and synthesis"],["Task Coordinator","Human task routing"],["Audit Assistant","Audit preparation"],["Support Assistant","Draft support responses"],["Education Assistant","Learning assistance"],["Analytics Worker","Report preparation"],["Integration Monitor","Connectivity checks"],["Compliance Assistant","Policy review support"]];
const layerDefinitions=[{"name":"CLOUD","kind":"Economic layer","desc":"AI, identity, governance, compute, data, security, records, trust and network services."},{"name":"UNDERGROUND","kind":"Economic layer","desc":"Mining, minerals, geological intelligence, underground infrastructure and industrial operations."},{"name":"EARTH SURFACE","kind":"Economic layer","desc":"Solar Grid, energy, climate, agriculture, food, water, land, buildings, environment, mobility and logistics."},{"name":"HUMAN ACTIVITIES","kind":"Economic layer","desc":"Business, professional services, education, healthcare, communities, grants, contribution, innovation and human development."}];
const gridLayerMap={"AI & Cloud":"CLOUD","Wallet Grid":"CLOUD","Ledger Grid":"CLOUD","Money Grid":"CLOUD","AI IQ Grid":"CLOUD","Collective Memory":"CLOUD","AI Discovery Engine":"CLOUD","Trust & Verification":"CLOUD","Civilization Ledger":"CLOUD","Bitcoin Trust Grid":"CLOUD","Monetary Network Grid":"CLOUD","Scarcity Model Grid":"CLOUD","Security History Grid":"CLOUD","Adoption Intelligence Grid":"CLOUD","Compute & AI Grid":"CLOUD","Data Processing Grid":"CLOUD","SaaS & Business Software Grid":"CLOUD","Cybersecurity & Automation Grid":"CLOUD","Mining & Minerals Grid":"UNDERGROUND","Geospatial & Geology Grid":"UNDERGROUND","Utilities & Infrastructure Grid":"UNDERGROUND","Equipment & Maintenance Grid":"UNDERGROUND","Solar Grid":"EARTH SURFACE","Climate Grid":"EARTH SURFACE","Environmental Intelligence Grid":"EARTH SURFACE","Energy Grid":"EARTH SURFACE","Agriculture Grid":"EARTH SURFACE","Food Grid":"EARTH SURFACE","Water Grid":"EARTH SURFACE","Land Grid":"EARTH SURFACE","Buildings & Services Grid":"EARTH SURFACE","Cleaning & Maintenance Grid":"EARTH SURFACE","Mobility & Logistics Grid":"EARTH SURFACE","Trade & Procurement Grid":"HUMAN ACTIVITIES","Professional Services Grid":"HUMAN ACTIVITIES","Education & Training Grid":"HUMAN ACTIVITIES","Care Services Grid":"HUMAN ACTIVITIES","Tourism & Hospitality Grid":"HUMAN ACTIVITIES","Energy":"EARTH SURFACE","Food, Water & Land":"EARTH SURFACE","Mobility & Logistics":"EARTH SURFACE","Buildings & Services":"EARTH SURFACE","Underground & Industry":"UNDERGROUND","Human Professional Services":"HUMAN ACTIVITIES","Sales AI":"HUMAN ACTIVITIES","Support AI":"HUMAN ACTIVITIES","Healthcare AI":"HUMAN ACTIVITIES","Education AI":"HUMAN ACTIVITIES","Contribution Grid":"HUMAN ACTIVITIES","Innovation Grid":"HUMAN ACTIVITIES","Innovation Network":"HUMAN ACTIVITIES","AI Twins™":"HUMAN ACTIVITIES","Innovation Dome™":"HUMAN ACTIVITIES","Simulation Grid":"HUMAN ACTIVITIES","Synthetic Reality™":"HUMAN ACTIVITIES","Human Progress Index":"HUMAN ACTIVITIES","Proof of Contribution":"HUMAN ACTIVITIES","Collective Intelligence":"HUMAN ACTIVITIES"};
const layerSwitches=Object.fromEntries(layerDefinitions.map(x=>[x.name,false]));
const gridSwitches=Object.fromEntries(gridData.map(x=>[x[0],false]));
function renderLayeredGridRegistry(){
 const host=document.getElementById("layerCards");
 const html=layerDefinitions.map(layer=>{
  const items=gridData.filter(g=>gridLayerMap[g[0]]===layer.name);
  const layerOn=!!layerSwitches[layer.name];
  const cards=items.map(g=>{
   const desired=!!gridSwitches[g[0]],effective=layerOn&&desired;
   return '<article class="module"><div class="moduletop"><div><h3>'+g[0]+'</h3><p>'+g[1]+'</p></div><span class="pill '+(effective?'green':'red')+'">'+(effective?'EFFECTIVE ON':'EFFECTIVE OFF')+'</span></div><div class="metricline"><span class="muted small">Catalogue status</span>'+statusPill(g[2])+'</div><div class="small muted" style="margin:0 0 6px">Evidence / dependency: '+g[3]+'</div><div class="small muted" style="margin:0 0 10px">Classification: '+g[4]+'</div><div class="metricline"><span class="small">Grid switch</span><button class="toggle '+(desired?'on':'')+'" role="switch" aria-checked="'+desired+'" aria-label="Toggle '+g[0]+'" data-grid-toggle="'+g[0]+'"></button></div><div class="small muted">'+(!layerOn?'Layer is OFF; Grid is isolated.':desired?'Grid desired state is ON; runtime still requires verification.':'Grid remains OFF until individually enabled.')+'</div></article>';
  }).join("");
  return '<section class="card" style="margin-bottom:15px"><div class="cardhead"><div><span class="eyebrow">'+layer.kind+'</span><h2 style="margin:5px 0">'+layer.name+'</h2><p class="muted small" style="margin:0">'+layer.desc+'</p></div><div style="text-align:right"><span class="pill '+(layerOn?'green':'red')+'">'+(layerOn?'LAYER ON':'LAYER OFF')+'</span><div style="margin-top:8px"><button class="toggle '+(layerOn?'on':'')+'" role="switch" aria-checked="'+layerOn+'" aria-label="Toggle layer '+layer.name+'" data-layer-toggle="'+layer.name+'"></button></div></div></div><div class="grid modulegrid">'+(cards||'<div class="empty">No Grid currently assigned to this layer.</div>')+'</div></section>';
 }).join("");
 host.innerHTML=html;
}
let taskRows=[];
function statusPill(s){return '<span class="pill '+(s==="ON"?"green":s==="OFF"?"red":"amber")+'">'+s+'</span>'}
function renderCards(id,data,type){document.getElementById(id).innerHTML=data.map((x,i)=>`<article class="module"><div class="moduletop"><div><h3>${x[0]}</h3><p>${x[1]}</p></div>${type==="grid"?statusPill(x[2]):type==="module"?statusPill(x[2]):'<span class="pill amber">CATALOGUED</span>'}</div>${type==="grid"?'<div class="small muted" style="margin:0 0 6px">Evidence / dependency: '+x[3]+'</div><div class="small muted" style="margin:0 0 10px">Classification: '+(x[4]||"Existing prototype catalogue")+'</div><div class="small muted">Lifecycle controls are illustrative only; no service is activated here.</div>':type==="module"?'<div class="seg" data-index="'+i+'" data-type="module"><button data-state="ON" '+(x[2]==="ON"?'class="selected"':'')+'>ON</button><button data-state="STANDBY" '+(x[2]==="STANDBY"?'class="selected"':'')+'>STANDBY</button><button data-state="OFF">OFF</button></div>':'<div class="metricline"><span class="muted small">Runtime</span><b class="pill red">NOT CONNECTED</b></div><button class="btn" disabled>Execution unavailable</button>'}</article>`).join("")}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function openPage(page){const p=pages[page]||pages.overview;document.getElementById("crumb").textContent=p.title;document.querySelectorAll("#nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML='<div class="pagehead"><div><div class="eyebrow">CEDARS OS™ · COMMAND CENTER</div><h1>'+p.title+'</h1><p>'+p.sub+'</p></div><div class="actions"><button class="btn" id="helpBtn">ⓘ About this view</button><button class="btn primary" id="refreshBtn">↻ Refresh view</button></div></div>'+p.html+'<div class="footer-note">CEDARS OS™ · Hybrid Modular Enterprise Architecture · Preview prototype only · Not a live operational console</div>';if(page==="grids")renderLayeredGridRegistry();if(page==="modules")renderCards("moduleCards",moduleData,"module");if(page==="workers")renderCards("workerCards",workerData,"worker");if(page==="tasks")renderTasks();document.getElementById("refreshBtn").onclick=()=>showToast("Prototype view refreshed. No external data was requested.");document.getElementById("helpBtn").onclick=()=>showToast("Demonstration interface. Backend connections are not implied.");}
function renderTasks(){const el=document.getElementById("taskList");el.className=taskRows.length?"":"empty";el.innerHTML=taskRows.length?'<div class="tablewrap"><table><thead><tr><th>Task</th><th>Grid</th><th>Status</th><th>Execution</th></tr></thead><tbody>'+taskRows.map(t=>'<tr><td>'+t.title+'</td><td>'+t.grid+'</td><td><span class="pill amber">PENDING REVIEW</span></td><td><span class="pill red">NOT EXECUTED</span></td></tr>').join("")+'</tbody></table></div>':"No demo tasks created yet."}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)openPage(b.dataset.page)});
document.getElementById("content").addEventListener("click",e=>{
 const layerControl=e.target.closest("[data-layer-toggle]");
 if(layerControl){const name=layerControl.dataset.layerToggle;layerSwitches[name]=!layerSwitches[name];renderLayeredGridRegistry();showToast("Layer "+name+" "+(layerSwitches[name]?"ON":"OFF")+" · local prototype only.");return;}
 const gridControl=e.target.closest("[data-grid-toggle]");
 if(gridControl){const name=gridControl.dataset.gridToggle;const layer=gridLayerMap[name];gridSwitches[name]=!gridSwitches[name];renderLayeredGridRegistry();showToast("Grid "+name+" desired state "+(gridSwitches[name]?"ON":"OFF")+" · effective "+(layerSwitches[layer]&&gridSwitches[name]?"ON":"OFF")+" · local prototype only.");return;}
 const state=e.target.closest("[data-state]");if(state){const group=state.closest(".seg");group.querySelectorAll("button").forEach(b=>b.classList.toggle("selected",b===state));showToast("Local prototype state updated. No backend setting changed.");}if(e.target.id==="addTask"){const title=document.getElementById("taskTitle").value.trim();if(!title){showToast("Enter a task title first.");return}taskRows.unshift({title,grid:document.getElementById("taskGrid").value});renderTasks();document.getElementById("taskTitle").value="";showToast("Demo task added. No worker execution started.");}});
openPage("overview");
</script>
